function today(){return new Date().toISOString().slice(0,10);}
function newQuests(){return{date:today(),progress:{pulls:0,clears:0,levels:0,scouts:0,raids:0},claimed:[]};}
function migrate(v){if(!v||![2,3].includes(v.version))throw Error('Unsupported save version');if(v.version===2){v.version=3;v.inventory=[];v.equipped={};v.scrap=12;v.sigils=0;v.quest=newQuests();v.cosmetics={owned:['default'],active:'default'};v.banner='anime';v.profile={name:'Summoner',tag:'RIFT-'+Math.random().toString(36).slice(2,7).toUpperCase()};v.rivals=[];v.gift=false;v.riftClaim='';}if(v.dungeon===undefined)v.dungeon=null;if(v.tacticsGift===undefined)v.tacticsGift=false;for(const u of v.units||[])if(u.evolution===undefined)u.evolution=0;return v;}
function syncQuests(){if(S.quest.date!==today())S.quest=newQuests();}
function progressQuest(id,n=1){syncQuests();S.quest.progress[id]=(S.quest.progress[id]||0)+n;}
function elementMultiplier(a,b){if(a==='Neutral'||b==='Neutral'||a===b)return 1;const beats={Fire:'Wind',Wind:'Earth',Earth:'Water',Water:'Fire',Light:'Dark',Dark:'Light'};if(beats[a]===b)return a==='Light'||a==='Dark'?1.2:1.25;if(beats[b]===a)return .85;return 1;}
function eventInfo(){const seed=[...today()].reduce((n,c)=>n+c.charCodeAt(0),0)%3;return[{name:'Gilded Breach',desc:'+25% tower gold today.',gold:1.25,wood:1,xp:1},{name:'Verdant Echo',desc:'Double tower timber today.',gold:1,wood:2,xp:1},{name:'Memory Surge',desc:'+50% tower XP today.',gold:1,wood:1,xp:1.5}][seed];}

function dungeonMap(){const map=Array.from({length:DUNGEON_H},()=>Array(DUNGEON_W).fill('#'));const rect=(x1,y1,x2,y2)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)map[y][x]='.';};for(const room of [[1,10,5,13],[1,5,5,8],[8,5,12,8],[16,5,19,8],[8,10,12,13],[16,10,19,13],[6,1,10,3]])rect(...room);rect(3,7,18,7);rect(3,7,3,12);rect(3,12,18,12);rect(10,7,10,12);rect(18,7,18,12);rect(3,2,8,2);rect(3,2,3,7);return map;}

function validateDungeon(d){if(d===null||d===undefined)return;if(!d||d.version!==1||!Number.isInteger(d.level)||d.level<1||d.level>50||!Number.isInteger(d.x)||!Number.isInteger(d.y)||DUNGEON_MAP[d.y]?.[d.x]!=='.'||!Array.isArray(d.seen)||d.seen.length>315||!Array.isArray(d.cleared)||!Array.isArray(d.items)||d.items.length>30||!Array.isArray(d.team)||d.team.length<1||d.team.length>4||d.team.some(id=>!HERO(id))||!Number.isFinite(d.vitality)||d.vitality<1||d.vitality>100||!Number.isInteger(d.keys)||d.keys<0||d.keys>2||!d.loot)throw Error('Invalid dungeon save');for(const k of ['gems','gold','wood','scrap','xp'])if(!Number.isSafeInteger(d.loot[k])||d.loot[k]<0)throw Error('Invalid dungeon loot');for(const i of d.items)if(!i||!GEAR_SLOTS.includes(i.slot)||!Number.isInteger(i.rarity)||i.rarity<0||i.rarity>3||!Number.isInteger(i.level)||i.level<1||i.level>10||typeof i.uid!=='string'||!ELEMENTS.includes(i.element))throw Error('Invalid dungeon item');}

function startDungeon(){if(S.dungeon)throw Error('Resume or abandon your current dungeon first');if(!S.team.length)throw Error('Choose at least one hero first');if(S.dispatch&&S.team.some(id=>S.dispatch.ids.includes(id)))throw Error('A team hero is still away scouting');S.dungeon={version:1,level:Math.min(50,S.highest+1),x:3,y:12,lastX:3,lastY:12,seen:[],cleared:[],items:[],team:S.team.slice(),vitality:100,keys:0,blessed:false,pending:null,steps:0,loot:{gold:0,gems:0,wood:0,scrap:0,xp:0}};revealDungeon(S.dungeon);record('Entered the Forgotten Labyrinth.');save();screen='dungeon';render();}
function dungeonUI(){const d=S.dungeon;if(!d)return `${heading('PLAYABLE EXPLORATION','The Forgotten Labyrinth.','Lead your heroes through a branching dungeon. Find the gate key and extract your loot.')}<div class="split"><section class="panel"><div class="dungeon-poster"><span>⟐</span><h2>Every path has a price.</h2><p>Treasure. Traps. Guardians. A way home.</p></div><div class="row mt">${button('Enter dungeon','dungeon-start','primary')}${button('Choose squad','go-team')}</div></section><section class="panel"><h2>Expedition rules</h2><p class="mt">Move with WASD, arrow keys or the touch controls. Tap a discovered floor tile to walk there. Defeat the guardian to obtain the gate key.</p><p class="mt">Loot is unbanked until you extract. Traps drain squad vitality, which sets your starting battle HP. Shrines restore vitality; a hidden shrine boosts attack. Retreating from an encounter lets you retry. Abandoning forfeits unbanked loot.</p><div class="notice mt">This is exploration inside the game, separate from timed scouting. It does not skip tower floors. Your run saves as you move.</div></section></div>`;return `${heading('THE FORGOTTEN LABYRINTH · THREAT '+d.level,'Find the key. Bring them home.','WASD / arrows · Touch controls · Tap a discovered tile to move',button('Abandon run','dungeon-abandon','danger'))}<div class="dungeon-layout"><section><div class="dungeon-map-frame"><canvas id="dungeonCanvas" width="840" height="600" aria-label="Dungeon map. Use WASD, arrow keys, or the touch direction controls to move."></canvas><div class="dungeon-location" id="dungeonLocation">${dungeonLocation(d)}</div></div><div class="dungeon-controls"><div class="dpad">${button('↑','dungeon-move','','data-dx="0" data-dy="-1" aria-label="Move up"')}${button('←','dungeon-move','','data-dx="-1" data-dy="0" aria-label="Move left"')}${button('↓','dungeon-move','','data-dx="0" data-dy="1" aria-label="Move down"')}${button('→','dungeon-move','','data-dx="1" data-dy="0" aria-label="Move right"')}</div><small>✧ Cache &nbsp; ⚔ Encounter &nbsp; ◆ Trap &nbsp; ♡ Spring &nbsp; ⟐ Exit</small></div></section><aside class="panel"><div class="eyebrow">EXPEDITION STATUS</div><h2>Unbanked supplies</h2><div id="dungeonStatus">${dungeonStatus(d)}</div><div class="divider"></div><h3>Exploration squad</h3><div class="dungeon-party">${d.team.map(id=>`<div>${sprite(HERO(id))}<small>${HERO(id).name}</small></div>`).join('')}</div><div class="notice mt">The lower route has a trap and the key guardian. The northern route offers a spring, treasure and an optional vault battle. Follow the far northern passage to a hidden shrine.</div></aside></div>`;}
function dungeonStatus(d){return `<div class="listline"><span>Squad vitality</span><b>${d.vitality}%</b></div><div class="pity mt"><i style="width:${d.vitality}%"></i></div><div class="listline"><span>Gate keys</span><b>${d.keys}</b></div>${Object.entries(d.loot).map(([k,v])=>`<div class="listline"><span>${k.toUpperCase()}</span><b>+${v}</b></div>`).join('')}<div class="listline"><span>Equipment finds</span><b>${d.items.length}</b></div><div class="listline"><span>Star blessing</span><b>${d.blessed?'+15% ATK':'Not found'}</b></div>`;}
function dungeonLocation(d){const room=DUNGEON_ROOMS.find(r=>r.x===d.x&&r.y===d.y);return room?room.name:d.x===3&&d.y===12?'Entry courtyard':'Exploring the labyrinth';}
function dungeonHUD(){const d=S.dungeon;if(!d)return;const status=$('#dungeonStatus'),location=$('#dungeonLocation');if(status)status.innerHTML=dungeonStatus(d);if(location)location.textContent=dungeonLocation(d);}
function moveDungeon(dx,dy){if(B||busy||screen!=='dungeon'||$('#dialog').open)return false;const d=S.dungeon;if(!d||Math.abs(dx)+Math.abs(dy)!==1)return false;const x=d.x+dx,y=d.y+dy;if(DUNGEON_MAP[y]?.[x]!=='.')return false;d.lastX=d.x;d.lastY=d.y;d.x=x;d.y=y;d.steps++;revealDungeon(d);const room=DUNGEON_ROOMS.find(r=>r.x===x&&r.y===y),key=room?room.type+':'+x+','+y:'';if(room&&(!d.cleared.includes(key)||room.type==='exit')){dungeonPath=[];if(room.type==='chest'){d.cleared.push(key);d.loot.gold+=100+d.level*12;d.loot.gems+=25;d.loot.wood+=12;d.loot.scrap+=2;if(Math.random()<.5)d.items.push(makeItem(null,1));toast('Cache found! Supplies added to your unbanked loot.');}else if(room.type==='trap'){d.cleared.push(key);d.vitality=Math.max(20,d.vitality-22);toast('A rune trap drains 22 vitality. Find the spring to recover.');}else if(room.type==='shrine'){d.cleared.push(key);d.vitality=100;toast('Sanctuary spring: your squad’s vitality is restored.');}else if(room.type==='relic'){d.cleared.push(key);d.blessed=true;d.vitality=Math.min(100,d.vitality+25);toast('Star blessing discovered: +15% ATK in dungeon encounters!');}else if(room.type==='vault'){if(d.keys<2)toast('The vault needs two keys. Defeat both guarding encounters.');else{d.cleared.push(key);d.items.push(makeItem(null,2));d.loot.gems+=100;d.loot.gold+=300;toast('Sealed vault opened: Epic gear and extra supplies!');}}else if(room.type==='guard'||room.type==='enemy'){d.pending=key;save();openDialog(`${modalHead(room.type==='guard'?'GATE-KEY GUARDIAN':'VAULT SENTRIES')}<p>${room.type==='guard'?'Defeat this encounter to obtain the key needed for extraction.':'This optional battle gives a second key for the sealed vault.'}</p><p class="mt">Your squad enters at ${d.vitality}% vitality${d.blessed?', with +15% ATK from the star blessing':''}.</p><div class="row mt">${button('Fight','dungeon-fight','primary')}${button('Back away','dungeon-back')}</div>`);}else if(room.type==='exit'){if(d.keys<1)toast('Extraction is locke function beginDungeonFight(){const d=S.dungeon;if(!d||!d.pending)throw Error('No dungeon encounter is waiting');S.team=d.team.slice();beginBattle(d.level,null,false,true);}
function preTacticalFinishRewards(won){if(B?.dungeon)return null;return expansionFinishRewards(won);}
function endBattle(won,fled=false){if(!B?.dungeon)return expandedEndBattle(won,fled);if(B.over)return;clearTimeout(battleTimer);B.over=true;const d=S.dungeon;if(!d){B=null;screen='dungeon';render();return;}if(won){if(!d.cleared.includes(d.pending)){d.cleared.push(d.pending);d.keys=Math.min(2,d.keys+1);d.loot.gold+=150+d.level*20;d.loot.gems+=35;d.loot.wood+=15;d.loot.scrap+=2;d.loot.xp+=60+d.level*8;}const party=B.fighters.filter(a=>!a.side);d.vitality=Math.max(30,Math.round(party.reduce((n,a)=>n+a.hp,0)/party.reduce((n,a)=>n+a.max,0)*100));record('Dungeon guardian defeated; gate key acquired.');}else{d.vitality=Math.max(20,d.vitality-20);d.x=d.lastX;d.y=d.lastY;}d.pending=null;B=null;screen='dungeon';save();render();openDialog(`${modalHead(won?'ROOM SECURED':'THE SQUAD FALLS BACK')}<h2>${won?'A key—and a path forward.':'You can regroup and try again.'}</h2><p class="mt">${won?'Encounter rewards are stored in your unbanked dungeon supplies. Reach the extraction gate to bring them home.':'You retain your unbanked loot, but your squad loses 20 vitality. Find a spring, strengthen your heroes, or abandon the run.'}</p><div class="row mt">${button('Continue exploring','close','primary')}${button('Abandon run','dungeon-abandon','danger')}</div>`);}
function extractDungeon(){const d=S.dungeon;if(!d||d.x!==18||d.y!==12||d.keys<1)throw Error('Reach the extraction gate with a key first');const loot={...d.loot};for(const key of ['gold','gems','wood','scrap'])S[key]+=loot[key];for(const id of d.team){const u=S.units.find(u=>u.id===id);if(u)gainXP(u,loot.xp+75+d.level*5);}let items=0;for(const item of d.items)if(addItem(item))items++;if(addItem(makeItem(null,1)))items++;S.sigils+=8;S.dungeon=null;record('Extracted from the labyrinth with '+loot.gold+' gold and '+loot.gems+' gems.');save();$('#dialog').close();render();openDialog(`${modalHead('EXTRACTION COMPLETE')}<h1>Everyone comes home.</h1><p class="mt">All supplies have been banked. Your squad gains expedition XP.</p><div class="rewards">${Object.entries(loot).filter(([k])=>k!=='xp').map(([k,v])=>`<div class="reward"><b>+${v}</b><small>${k.toUpperCase()}</small></div>`).join('')}</div><p>${items} equipment items collected · +8 cosmetic sigils.</p><div class="row mt">${button('Back to sanctuary','dungeon-home','primary')}${button('Explore again','close')}</div>`);return loot;}
function dungeonFindPath(from,to){if(DUNGEON_MAP[to.y]?.[to.x]!=='.')return[];const queue=[{...from,path:[]}],seen=new Set([from.x+','+from.y]);for(let i=0;i<queue.length;i++){const item=queue[i];if(item.x===to.x&&item.y===to.y)return item.path;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=item.x+dx,y=item.y+dy,key=x+','+y;if(DUNGEON_MAP[y]?.[x]==='.'&&!seen.has(key)){seen.add(key);queue.push({x,y,path:[...item.path,{dx,dy}]});}}}return[];}
function startDungeonCanvas(){cancelAnimationFrame(dungeonFrame);const canvas=$('#dungeonCanvas');if(!canvas?.getContext)return;const ctx=canvas.getContext('2d');if(!ctx)return;dungeonCanvas=canvas;ctx.imageSmoothingEnabled=false;let ax=S.dungeon.x,ay=S.dungeon.y,last=performance.now();const tile=40;function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}function draw(t){if(screen!=='dungeon'||!S.dungeon||!document.body.contains(canvas)){cancelAnimationFrame(dungeonFrame);return;}const d=S.dungeon,dt=Math.min((t-last)/1000,.05);last=t;ax+=(d.x-ax)*Math.min(1,dt*12);ay+=(d.y-ay)*Math.min(1,dt*12);if(t-dungeonLastMove>165&&!$('#dialog').open){let dir=null;for(const [key,v] of [['arrowup',[0,-1]],['w',[0,-1]],['arrowdown',[0,1]],['s',[0,1]],['arrowleft',[-1,0]],['a',[-1,0]],['arrowright',[1,0]],['d',[1,0]]])if(dungeonKeys.has(key)){dir=v;dungeonPath=[];break;}if(!dir&&dungeonPath.length){const next=dungeonPath.shift();dir=[next.dx,next.dy];}if(dir){dungeonLastMove=t;moveDungeon(...dir);if(B||screen!=='dungeon')return;}}rect(0,0,840,600,'#08101c');const seen=new Set(d.seen);for(let y=0;y<DUNGEON_H;y++)for(let x=0;x<DUNGEON_W;x++){if(!seen.has(x+','+y))continue;const wall=DUNGEON_MAP[y][x]==='#';rect(x*tile,y*tile,tile,tile,wall?'#2b3b4a':(x+y)%2?'#41584e':'#3b5149');if(wall){rect(x*tile+2,y*tile+2,36,7,'#455869');rect(x*tile+1,y*tile+20,37,2,'#172833');rect(x*tile+19,y*tile+5,2,15,'#1c2f3c');}else{rect(x*tile+3,y*tile+35,31,2,'#70856c30');rect(x*tile+8,y*tile+8,6,2,'#78937620');}if(Math.abs(x-d.x)+Math.abs(y-d.y)>4)rect(x*tile,y*tile,tile,tile,'#08101c55');}for(const r of DUNGEON_ROOMS){if(!seen.has(r.x+','+r.y))continue;const done=d.cleared.includes(r.type+':'+r.x+','+r.y);if(done){rect(r.x*40+15,r.y*40+17,10,6,'#263f36');continue;}const glyph={chest:'✧',trap:'◆',shrine:'♡',relic:'★',guard:'⚔',enemy:'⚔',vault:'▣',exit:'⟐'}[r.type];ctx.fillStyle=r.type==='trap'?'#c58d7d':r.type==='exit'?'#9bd8dc':r.type==='shrine'?'#b8e6ba':'#e5cc87';ctx.textAlign='center';ctx.font='bold 25px monospace';ctx.fillText(glyph,r.x*40+20,r.y*40+29+Math.sin(t/500+r.x)*1.5);}for(let i=d.team.length-1;i>=0;i--){const h=HERO(d.team[i]),visual=evolutionVisual(h.id),source=visual?visual.source:h.anime?ANIME_ATLASES[h.pack]:ATLAS;if(!source)continue;const key=visual?'evolved':h.anime?'a'+h.pack:'original';if(!dungeonImages[key]){const img=new Image();img.src=source;dungeonImages[key]=img;}const img=dungeonImages[key];if(img.complete&&img.naturalWidth){const cols=visual?4:h.anime?5:6,rows=visual?2:h.anime?3:4,art=visual?visual.index:h.art,sw=img.naturalWidth/cols,sh=img.naturalHeight/rows;const px=ax*40+20-i*8,py=ay*40+20+i*5;rect(px-11,py+13,24,5,'#10281c66');ctx.drawImage(img,art%cols*sw,Math.floor(art/cols)*sh,sw,sh,Math.round(px-23),Math.round(py-27+(Math.sin(t/170+i)*1.2)),46,46);}}dungeonFrame=requestAnimationFrame(draw);}canvas.addEventListener('click',e=>{const d=S.dungeon;if(!d||$('#dialog').open)return;const box=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-box.left)/box.width*21),y=Math.floor((e.clientY-box.top)/box.height*15);if(!d.seen.includes(x+','+y)){toast('Explore closer to reveal this part of the dungeon.');return;}dungeonPath=dungeonFindPath(d,{x,y});});dungeonFrame=requestAnimationFrame(draw);}

const EVOLUTION_ART_IDS=['naruto','luffy','gojo','eren','kaneki','guts','itachi','saber'];
if(EVOLUTION_ART)document.documentElement.style.setProperty('--evolution-atlas','url('+EVOLUTION_ART+')');
const EVOLUTION_FORMS={lelouch:['Zero','Emperor of Rebellion'],levi:['Ackerman Awakening','Wings of Freedom'],lawliet:['Master Detective','Final Deduction'],luffy:['Gear Fourth','Gear Fifth'],zoro:['Asura Awakening','King of Hell'],okabe:['Mad Scientist','Worldline Savior'],light:['Kira','New World Architect'],killua:['Thunderbolt','Godspeed'],edward:['State Alchemist','Truth Seeker'],naruto:['Sage Mode','Kurama Chakra Mode'],gintoki:['Shiroyasha','Silver Soul'],guts:['Black Swordsman','Berserker Armor'],kurisu:['Time Researcher','Worldline Architect'],itachi:['Mangekyo Awakening','Susanoo'],eren:['Titan Awakening','Attack Titan'],mikasa:['Ackerman Awakening','Wings of Freedom'],hachiman:['Service Club Strategist','Genuine Connection'],kaneki:['Half-Kakuja','Kakuja'],rem:['Oni Awakening','Oni Devotion'],saitama:['Serious Mode','Serious Series'],kakashi:['Sharingan Awakening','Master Copy Ninja'],spike:['Bounty Hunter','Space Cowboy'],gojo:['Limitless Awakening','Unlimited Void'],kirito:['Dual Blades','Starburst Ascension'],hitagi:['Weightless Resolve','Starlit Resolve'],yato:['Delivery God','Calamity Severer'],megumin:['Crimson Adept','Ultimate Explosion'],joseph:['Hamon Adept','Battle Tendency'],roy:['Flame Colonel','Inferno Commander'],hisoka:['Magician','Bungee Gum Master'],zerotwo:['Partner Sync','Strelizia Awakening'],mai:['Unseen Resolve','Unforgettable Presence'],shinobu:['Vampire Awakening','Golden Night'],emilia:['Spirit Arts','Frozen Sanctuary'],kamina:['Team Leader','Spiral Resolve'],taiga:['Palmtop Tiger','Unbreakable Heart'],saber:['Mana Burst','Excalibur Release'],dazai:['Nullification','Perfect Nullification'],violet:['Auto Memory Doll','Eternal Letters']};
const EVOLUTION_REQUIREMENTS=[{level:10,floor:5,gold:1500,scrap:12},{level:25,floor:15,gold:5000,scrap:35}];
function evolutionStage(u){return u?.evolution||0;}
function evolutionForm(id,stage){return stage?(EVOLUTION_FORMS[id]||['Awakened Champion','Ascended Legend'])[stage-1]:'Base form';}
function evolvedSkill(h,stage){return{skill:stage?evolutionForm(h.id,stage)+' · '+h.skill:h.skill,type:h.type,mult:h.mult*(stage===2?1.35:stage===1?1.15:1),baseCD:Math.max(2,h.cd-(stage===2?1:0)),role:h.role,element:h.element};}
function evolutionVisual(id,stage=null){const value=stage===null?evolutionStage(S.units.find(u=>u.id===id)):stage;const index=EVOLUTION_ART_IDS.indexOf(id);return value===2&&index>=0&&EVOLUTION_ART?{source:EVOLUTION_ART,index}:null;}
function sprite(h,extra='',override=null){if(!h)return '';const u=S.units.find(u=>u.id===h.id),stage=override===null?evolutionStage(u):override,visual=evolutionVisual(h.id,stage);if(visual)return `<div class="sprite evolution-${stage} ${extra}" style="background-image:var(--evolution-atlas);background-size:400% 200%;background-position:${visual.index%4*100/3}% ${Math.floor(visual.index/4)*100}%" role="img" aria-label="${esc(h.name)} ${esc(evolutionForm(h.id,stage))} pixel sprite"></div>`;return baseSprite(h,('evolution-'+stage+' '+extra).trim());}
function evolveHero(id){if(B||busy)throw Error('Finish the current battle or summon first');const u=S.units.find(u=>u.id===id);if(!u)throw Error('Hero not owned');const stage=evolutionStage(u);if(stage>=2)throw Error('This hero is fully evolved');const r=EVOLUTION_REQUIREMENTS[stage];if(u.level<r.level)throw Error('Reach hero level '+r.level+' first');if(S.highest<r.floor)throw Error('Clear tower floor '+r.floor+' first');if(S.gold<r.gold||S.scrap<r.scrap)throw Error('Evolution needs '+r.gold+' gold and '+r.scrap+' scrap');if(S.dispatch?.ids.includes(id))throw Error('Wait for this hero to return from scouting');S.gold-=r.gold;S.scrap-=r.scrap;u.evolution=stage+1;record(HERO(id).name+' evolved into '+evolutionForm(id,u.evolution)+'.');return evolutionForm(id,u.evolution)+' unlocked!';}
function evolutionPreview(id){const u=S.units.find(u=>u.id===id);if(!u)return;detailID=null;const h=HERO(id),stage=evolutionStage(u),r=EVOLUTION_REQUIREMENTS[stage],before=stat(u),after=stage<2?stat({...u,evolution:stage+1}):before;openDialog(`${modalHead(stage>=2?'EVOLUTION COMPLETE':'EVOLVE HERO')}<div class="dossier"><div>${sprite(h)}<p style="text-align:center;font-size:11px">${evolutionForm(id,stage)}</p></div><div><div class="eyebrow">${h.name} · TIER ${stage} / 2</div><h1>${stage<2?evolutionForm(id,stage+1):evolutionForm(id,stage)}</h1><p class="mt">${stage<2?'Unlock a permanent form, stronger base stats and an upgraded skill.':'This hero has reached their final evolution.'}</p><div class="detailstats">${Object.keys(before).map(k=>`<div>${k.toUpperCase()}<b>${before[k]}${stage<2?' → '+after[k]:''}</b></div>`).join('')}</div>${r?`<div class="evolution-req"><span class="${u.level>=r.level?'ready':''}">Hero Lv ${r.level} · ${u.level}/${r.level}</span><span class="${S.highest>=r.floor?'ready':''}">Clear floor ${r.floor} · ${S.highest}/${r.floor}</span><span class="${S.gold>=r.gold?'ready':''}">● ${r.gold} gold</span><span class="${S.scrap>=r.scrap?'ready':''}">⚒ ${r.scrap} scrap</span></div><div class="skillbox mt"><h3>${evolvedSkill(h,stage+1).skill}</h3><p>Skill power +${stage+1===2?35:15}% above base${stage+1===2?'; cooldown reduced by one turn, minimum two':''}. Base stats ${stage+1===2?'+45%':'+20%'}; SPD +${(stage+1)*2}. Gear bonuses are added afterwards.</p></div>${button('Unlock evolution','evolve-confirm','primary',`data-id="${id}" style="margin-top:20px" ${u.level<r.level||S.highest<r.floor||S.gold<r.gold||S.scrap<r.scrap?'disabled':''}`)}`:'<div class="notice mt">Final form active in tower battles, dungeon exploration and exported defence teams.</div>'}</div></div>`);}
function evolutionsUI(){return `${heading('HERO ASCENSION','Break through your limits.','Every hero has two permanent evolution tiers. Keep levels, stars and equipment.')}<div class="notice">Tier I: Lv 10 + clear floor 5 + 1,500 gold + 12 scrap. Tier II: Lv 25 + clear floor 15 + 5,000 gold + 35 scrap. Forms are game adaptations. Eight featured heroes have distinct ultimate artwork; other forms use an evolution aura.</div><div class="grid mt">${S.units.map(u=>{const h=HERO(u.id),stage=evolutionStage(u),r=EVOLUTION_REQUIREMENTS[stage];return `<article class="hero rar${h.rarity}"><div class="hero-top"><span>LV ${u.level}</span><span>EVOLUTION ${stage} / 2</span></div>${sprite(h)}<div class="hero-info"><h3>${h.name}</h3><p style="font-size:11px;margin-top:7px">${evolutionForm(h.id,stage)}</p><small>${r?'Next: '+evolutionForm(h.id,stage+1)+' · Lv '+r.level+' / Floor '+r.floor:'Final form unlocked'}</small><div class="hero-buttons">${button(stage>=2?'View final form':'View evolution','evolution-view',stage<2?'primary':'',`data-id="${h.id}"`)}</div></div></article>`;}).join('')}</div>`;}
function gearScore(item,id){const h=HERO(id),v=gearStats(item,h.element),weights={DPS:{hp:.45,atk:5,def:1,spd:2},Tank:{hp:1,atk:1,def:5,spd:1},Healer:{hp:.75,atk:4,def:2,spd:2},Support:{hp:.7,atk:3,def:2,spd:3}}[h.role];return Object.keys(v).reduce((score,k)=>score+v[k]*weights[k],0);}
function equipBest(id){if(B)throw Error('Cannot change gear during battle');if(!S.units.some(u=>u.id===id))throw Error('Choose a hero first');let changed=0,available=0;for(const slot of GEAR_SLOTS){const candidates=S.inventory.filter(item=>item.slot===slot&&(!ownerOf(item.uid)||ownerOf(item.uid)===id));if(!candidates.length)continue;available++;const current=S.equipped[id]?.[slot];candidates.sort((a,b)=>gearScore(b,id)-gearScore(a,id)||(a.uid===current?-1:b.uid===current?1:0)||a.uid.localeCompare(b.uid));if(candidates[0].uid!==current){equipItem(candidates[0].uid,id);changed++;}}return available?(changed?HERO(id).name+': '+changed+' gear slots upgraded.':'This hero already has the best available gear.'):'No available gear. Craft items or clear floors first.';}
function planBestTeam(ids){const plan={};for(const slot of GEAR_SLOTS){const items=S.inventory.filter(i=>i.slot===slot&&(!ownerOf(i.uid)||ids.includes(ownerOf(i.uid))));let dp=new Map([[0,{score:0,assigned:{}}]]);for(const item of items){const next=new Map(dp);for(const [mask,state] of dp){for(let index=0;index<ids.length;index++){if(mask&(1<<index))continue;const id=ids[index],newMask=mask|(1<<index),score=state.score+gearScore(item,id)+(ownerOf(item.uid)===id ? 0.000001 : 0);if(!next.has(newMask)||score>next.get(newMask).score)next.set(newMask,{score,assigned:{...state.assigned,[id]:item.uid}});}}dp=next;}let best={score:-1,assigned:{}};for(const value of dp.values())if(value.score>best.score)best=value;for(const [id,uid] of Object.entries(best.assigned)){plan[id]??={};plan[id][slot]=uid;}}return plan;}
function equipBestTeam(){if(B)throw Error('Cannot change gear during battle');if(!S.team.length)throw Error('Assign a team first');const ids=S.team.slice(),plan=planBestTeam(ids);let count=0;for(const id of ids)for(const slot of GEAR_SLOTS)if((S.equipped[id]?.[slot]||null)!==(plan[id]?.[slot]||null))count++;if(!count)return 'Your team already has the best available gear.';for(const id of ids)S.equipped[id]={};for(const [id,slots] of Object.entries(plan))for(const uid of Object.values(slots))equipItem(uid,id);return 'Best team loadout equipped: '+count+' slots changed. Other heroes kept their gear.';}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;switch(el.dataset.a){case 'evolution-view':evolutionPreview(el.dataset.id);break;case 'evolve-confirm':{const id=el.dataset.id,result=act(()=>evolveHero(id));if(result){detailID=null;openDialog(`${modalHead('EVOLUTION UNLOCKED')}<div class="evolution-celebration">${sprite(HERO(id))}<div class="eyebrow mt">${HERO(id).name}</div><h1>${evolutionForm(id,evolutionStage(S.units.find(u=>u.id===id)))}</h1><p class="mt">The new form, stats and skill are now active.</p>${button('Continue','close','primary','style="margin-top:20px"')}</div>`);}break;}case 'equip-best':{const id=el.dataset.id||gearHero,was=detailID;act(()=>equipBest(id));if(was)detail(was);break;}case 'equip-best-team':act(equipBestTeam);break;}});
function selectBestHeroes(){if(B)throw Error('Finish the current battle first');const away=new Set(S.dispatch?.ids||[]),available=S.units.filter(u=>!away.has(u.id));if(!available.length)throw Error('No heroes are available');const score=u=>{const t=stat(u);return t.hp+t.atk*4+t.def*3+t.spd*2;};available.sort((a,b)=>score(b)-score(a)||a.id.localeCompare(b.id));const chosen=[];for(const role of ['Tank','Healer']){const u=available.find(u=>HERO(u.id).role===role);if(u)chosen.push(u.id);}for(const u of available){if(chosen.length>=4)break;if(!chosen.includes(u.id))chosen.push(u.id);}S.team=chosen;return 'Best available heroes selected, with a Tank and Healer where available.';}
document.addEventListener('click',e=>{if(e.target.closest('[data-a="best-heroes"]')&&!e.target.closest('[disabled]'))act(selectBestHeroes);});

const BATTLE_W=9,BATTLE_H=7;
const RANGED_HEROES=new Set(['lyra','fern','wyn','mira','lune','nyx','vesper','sera','elya','roy','megumin','gojo','light','itachi','edward','killua','kakashi','spike','hisoka','lelouch']);
const BATTLE_BLOCKS=[{x:4,y:1},{x:4,y:5}];
let gearSlotFilter='All',gearRarityFilter='All',gearOwnerFilter='All';
function floorTactics(f){if(f<=3)return{title:'Frontline drills',hint:'Move a Tank forward, keep your Healer in range, and focus attacks on one enemy.',roles:['Tank','Healer'],kind:'training'};return [{title:'Sniper ambush',hint:'Ranged enemies pressure the back line. A Tank can Taunt; ranged damage helps close the gap.',roles:['Tank','DPS'],kind:'snipers'},{title:'Iron phalanx',hint:'The first enemy takes 45% less damage until exposed. A Support Tactic or DPS Piercing Strike counters its plating.',roles:['Support','DPS'],kind:'armor'},{title:'Venom garden',hint:'Poison drains 6% max HP each round. Healer skills cleanse and briefly protect targets; keep allies together for area healing.',roles:['Healer'],kind:'poison'},{title:'Arcane conduit',hint:'A conduit wards all enemies. Support can disable it from 3 tiles with their Tactic. Other heroes can strike it three times from adjacent tiles.',roles:['Support'],kind:'conduit'},{title:'Ravager hunt',hint:'Red tiles show an incoming blast. Move out before ending the round, or use a Tank’s Guard to reduce the hit.',roles:['Tank','DPS'],kind:'ravager'}][f%5];}
function battleDistance(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);}
function inBattleMap(x,y){return Number.isInteger(x)&&Number.isInteger(y)&&x>=0&&x<BATTLE_W&&y>=0&&y<BATTLE_H;}
function battleBlocked(x,y){return BATTLE_BLOCKS.some(p=>p.x===x&&p.y===y);}
function unitAt(x,y){return B?.fighters.find(a=>a.hp>0&&a.x===x&&a.y===y);}
function battleLOS(a,b){let x=a.x,y=a.y,dx=Math.abs(b.x-x),dy=Math.abs(b.y-y),sx=x<b.x?1:-1,sy=y<b.y?1:-1,err=dx-dy;while(x!==b.x||y!==b.y){const e=2*err;if(e>-dy){err-=dy;x+=sx;}if(e<dx){err+=dx;y+=sy;}if(battleBlocked(x,y))return false;}return true;}
function battleReach(a,limit){const queue=[{x:a.x,y:a.y,d:0,path:[]}],seen=new Set([a.x+','+a.y]),out=[];for(let i=0;i<queue.length;i++){const p=queue[i];if(p.d>0)out.push(p);if(p.d>=limit)continue;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=p.x+dx,y=p.y+dy,key=x+','+y;if(!inBattleMap(x,y)||battleBlocked(x,y)||seen.has(key)||unitAt(x,y))continue;seen.add(key);queue.push({x,y,d:p.d+1,path:[...p.path,{x,y}]});}}return out;}
function moveRange(a){return Math.min(4,2+Math.floor(a.spd/24));}
function attackRange(a){return a.side?(a.ranged?3:1):a.role==='Support'?3:a.role==='Healer'?2:RANGED_HEROES.has(a.id)?3:1;}
function signatureRange(a){return ['heal','healAll','rally','weaken','stun','dispel','aoe'].includes(a.type)?3:Math.max(2,attackRange(a));}
function canTarget(a,t,range){return t&&battleDistance(a,t)<=range&&battleLOS(a,t);}
function currentHero(){return B?.fighters.find(a=>a.key===B.selected&&a.hp>0&&!a.side);}
function setupWarnings(){if(!B)return;B.warnings=[];const e=live(1).find(a=>a.windup);if(e){const target=live(0).slice().sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];if(target)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(Math.abs(dx)+Math.abs(dy)<=1&&inBattleMap(target.x+dx,target.y+dy))B.warnings.push({x:target.x+dx,y:target.y+dy});}}
function beginBattle(f,raidIndex=null,eventRun=false,dungeonRun=false,scrapRun=0){if(B||busy)return;if(!S.team.length)throw Error('Choose at least one hero first');if(S.dispatch&&S.team.some(id=>S.dispatch.ids.includes(id)))throw Error('A team hero is still scouting');let foes,raid=null;if(raidIndex!==null){if(Date.now()<S.raidReady)throw Error('Raiding recovery: '+timeLeft(S.raidReady));raid=raidTargets[raidIndex];if(!raid)throw Error('Opponent unavailable');foes=raid.peer?raid.units.map((a,i)=>({...a,key:'peer'+i,name:HERO(a.id).name,side:1,max:a.hp,shield:0,cd:0,stun:0,weaken:0,buff:0,turns:0,...skillFields(a.id,a.evolution||0)})):raid.ids.map((id,i)=>fighter(id,1,raid.level,i));S.raidReady=Date.now()+120000;}else{if(!Number.isInteger(f)||f<1||f>50||(!eventRun&&!scrapRun&&f>S.highest+1))throw Error('Floor is locked');foes=makeEnemies(f);}const allies=S.team.map(id=>fighter(id));B={tactical:true,floor:f,raid,event:eventRun,dungeon:dungeonRun,scrapRun,fighters:[...allies,...foes],round:1,phase:'player',selected:allies[0].key,command:'move',logs:[],speed:S.speed,auto:false,paused:false,over:false,adds:false,rule:scrapRun?{title:'Salvage patrol',hint:'Defeat the patrol to recover guaranteed crafting scrap. Repeat as often as you like.',roles:['Tank','Healer'],kind:'training'}:floorTactics(f),conduit:3,enemyQueue:[],warnings:[],endConfirm:false};applySynergies(B.fighters);const positions=[{x:1,y:1},{x:1,y:3},{x:1,y:5},{x:0,y:3}],enemyPositions=[{x:7,y:1},{x:7,y:3},{x:7,y:5},{x:8,y:3}];for(let i=0;i<allies.length;i++){Object.assign(allies[i],positions[i],{acted:false,moved:false,tacticCD:0,guarding:false,taunt:0,antidote:0});if(dungeonRun&&S.dungeon){allies[i].hp=Math.max(1,Math.round(allies[i].max*S.dungeon.vitality/100));if(S.dungeon.blessed)allies[i].atk=Math.round(allies[i].atk*1.15);}}for(let i=0;i<foes.length;i++){Object.assign(foes[i],enemyPositions[i%4],{ranged:B.rule.kind==='snipers'||i===2,armored:B.rule.kind==='armor'&&i===0,windup:B.rule.kind==='ravager'&&i===0,guarding:false,tacticCD:0});if(eventRun){foes[i].hp=foes[i].max=Math.round(foes[i].max*1.15);foes[i].atk=Math.round(foes[i].atk*1.1);}}setupWarnings();writeLog('Your turn. Select a hero, move, then choose a move and its target.');clearTimeout(battleTimer);detailID=null;$('#dialog').close();screen='battle';save();render();}
function damage(a,target,mult=1,options={}){if(!B?.tactical)return legacyDamage(a,target,mult);let modifier=1;if(target.guarding)modifier*=.5;if(target.side&&target.armored&&target.weaken<=0&&!options.pierce)modifier*=.55;if(target.side&&B.rule.kind==='conduit'&&B.conduit>0)modifier*=.35;if(battleDistance(a,target)>1&&((target.x===3&&target.y===2)||(target.x===5&&target.y===4)))modifier*=.8;if(!target.side&&live(0).some(t=>t!==target&&t.role==='Tank'&&t.guarding&&battleDistance(t,target)<=1))modifier*=.8;const def=target.def;if(options.pierce||target.weaken>0)target.def=Math.round(def*.35);const result=legacyDamage(a,target,mult*modifier);target.def=def;return result;}
function manualHeal(a,target,mult){target.antidote=2;return heal(a,target,mult)+' · cleansed';}
function actionReady(){return B?.tactical&&B.phase==='player'&&!B.over;}
function selectBattleHero(key){if(!actionReady())return;const a=B.fighters.find(a=>a.key===key&&!a.side&&a.hp>0);if(!a)return;if(a.acted){toast('This hero has acted. End the round to refresh actions.');return;}B.selected=key;B.command='move';B.endConfirm=false;renderBattle();}
function moveBattleHero(x,y){if(!actionReady())return false;const a=currentHero();if(!a||a.acted||a.moved)throw Error('This hero has already moved or acted');const route=battleReach(a,moveRange(a)).find(p=>p.x===x&&p.y===y);if(!route)throw Error('That tile is blocked or out of movement range');B.motion={key:a.key,dx:a.x-x,dy:a.y-y};a.x=x;a.y=y;a.moved=true;B.endConfirm=false;if(x===4&&y===3){const n=Math.min(a.hp-1,Math.round(a.max*.1));a.hp-=Math.max(0,n);writeLog(a.name+' crosses a hazard and loses '+Math.max(0,n)+' HP.');}else writeLog(a.name+' moves '+route.d+' tiles.');B.command='attack';renderBattle();return true;}
function signatureFriendly(a){return ['heal','healAll','shieldAll','rally'].includes(a.type);}
function performSignature(a,t){const allies=live(0),foes=live(1);let result='';if(a.type==='heal')result=manualHeal(a,t,a.mult);else if(a.type==='healAll')result=allies.filter(u=>battleDistance(u,t)<=1).map(u=>manualHeal(a,u,a.mult)).join(', ');else if(a.type==='shieldAll'){const n=Math.round(a.atk*a.mult+a.max*.1);for(const u of allies.filter(u=>battleDistance(u,a)<=2))u.shield=Math.max(u.shield,n);result='Nearby allies gain '+n+' barrier';a.taunt=a.role==='Tank'?2:0;}else if(a.type==='rally'){for(const u of allies.filter(u=>battleDistance(u,a)<=3))u.buff=3;result='Nearby allies gain +30% ATK for 3 rounds; '+manualHeal(a,t,a.mult);}else if(a.type==='aoe')result=foes.filter(u=>battleDistance(u,t)<=1).map(u=>damage(a,u,a.mult,{area:true})).join(', ');else if(a.type==='weaken'){for(const u of foes.filter(u=>battleDistance(u,t)<=1))u.weaken=3;result=damage(a,t,a.mult,{pierce:true})+'; nearby enemies exposed';}else if(a.type==='stun'){t.stun=t.boss?0:1;result=damage(a,t,a.mult)+(t.boss?' · boss resists stun':' · stunned');}else if(a.type==='drain')result=damage(a,t,a.mult)+'; '+heal(a,a,1.2);else if(a.type==='execute')result=damage(a,t,a.mult*(t.hp/t.max<.35?1.6:1));else if(a.type==='cleave'){result=damage(a,t,a.mult);for(const u of foes.filter(u=>u!==t&&battleDistance(u,t)<=1))damage(a,u,.65);}else if(a.type==='selfShield'){a.shield=Math.min(a.max,a.shield+Math.round(a.max*.35));a.taunt=2;result=damage(a,t,a.mult);}else if(a.type==='dispel'){for(const u of foes.filter(u=>battleDistance(u,t)<=1)){u.shield=0;u.buff=0;u.weaken=2;}result=damage(a,t,a.mult,{pierce:true})+'; nearby wards removed';}else result=damage(a,t,a.mult);a.cd=a.baseCD;animate(a.key,'cast');writeLog(a.name+' uses '+a.skill+' · '+result);}
function resolvePlayerAction(command,x=null,y=null){if(!actionReady())throw Error('Wait for the enemy turn');const a=currentHero();if(!a||a.acted)throw Error('Select a hero who has not acted');const t=unitAt(x,y),cell={x,y};if(command==='guard'){a.guarding=true;if(a.role==='Tank')a.taunt=2;writeLog(a.name+' guards: incoming damage −50%'+(a.role==='Tank'?' and nearby allies protected.':'.'));}else if(command==='tactic'&&a.role==='Tank'){if(a.tacticCD>0)throw Error('Tactic is cooling down');a.guarding=true;a.taunt=2;a.shield=Math.max(a.shield,Math.round(a.max*.25));for(const u of live(0).filter(u=>u!==a&&battleDistance(u,a)<=2))u.shield=Math.max(u.shield,Math.round(a.max*.1));a.tacticCD=3;writeLog(a.name+' uses Taunting Guard. Stay close for protection.');}else if(B.rule.kind==='conduit'&&B.conduit>0&&x===4&&y===0){const range=command==='tactic'&&a.role==='Support'?3:1;if(command!=='attack'&&!(command==='tactic'&&a.role==='Support'))throw Error('Use an adjacent Strike, or a Support Tactic from range 3');if(!canTarget(a,cell,range))throw Error('Move closer to the conduit');if(command==='tactic'&&a.tacticCD>0)throw Error('Tactic is cooling down');B.conduit=Math.max(0,B.conduit-(command==='tactic'?3:1));if(command==='tactic')a.tacticCD=2;writeLog(a.name+' disrupts the conduit. '+(B.conduit?'Charges left: '+B.conduit:'Enemy ward disabled!'));}else if(command==='attack'){if(!t||!t.side||!canTarget(a,t,attackRange(a)))throw Error('Choose an enemy in Strike range with a clear line of sight');writeLog(a.name+' strikes · '+damage(a,t));}else if(command==='skill'){if(a.cd>0)throw Error('Signature skill is cooling down');const friendly=signatureFriendly(a);if(['shieldAll'].includes(a.type)){performSignature(a,a);}else{if(!t||t.side!==(friendly?0:1)||!canTarget(a,t,signatureRange(a)))throw Error('Choose '+(friendly?'an ally':'an enemy')+' in skill range with line of sight');performSignature(a,t);}}else if(command==='tactic'){if(a.tacticCD>0)throw Error('Tactic is cooling down');if(a.role==='Healer'){if(!t||t.side||!canTarget(a,t,3))throw Error('Choose an ally within 3 tiles');writeLog(a.name+' uses Field Mend · '+manualHeal(a,t,2.2));}else{if(!t||!t.side||!canTarget(a,t,a.role==='Support'?3:attackRange(a)))throw Error('Choose an enemy within Tactic range');if(a.role==='Support')t.weaken=3;writeLog(a.name+' uses '+(a.role==='Support'?'Expose Weakness':'Piercing Strike')+' · '+damage(a,t,a.role==='DPS'?1.4:1,{pierce:true}));}a.tacticCD=2;}else throw Error('Unknown combat action');a.acted=true;B.endConfirm=false;B.command='move';const next=live(0).find(u=>!u.acted);if(next)B.selected=next.key;renderBattle();if(!live(1).length){B.phase='resolving';battleTimer=setTimeout(()=>{if(B)endBattle(true);},250);}return true;}
function selectBattleCommand(command){if(!actionReady())return;const a=currentHero();if(!a||a.acted){toast('Select a hero who has not acted.');return;}if(command==='guard'||(command==='tactic'&&a.role==='Tank')||(command==='skill'&&a.type==='shieldAll')){act(()=>resolvePlayerAction(command,a.x,a.y),false);return;}if(command==='skill'&&a.cd>0){toast('Skill ready in '+a.cd+' rounds.');return;}if(command==='tactic'&&a.tacticCD>0){toast('Tactic ready in '+a.tacticCD+' rounds.');return;}B.command=command;B.endConfirm=false;renderBattle();}
function battleTileClick(x,y){if(!actionReady())return;const unit=unitAt(x,y),a=currentHero();if(unit&&!unit.side){if(a&&['skill','tactic'].includes(B.command)&&((B.command==='skill'&&signatureFriendly(a))||(B.command==='tactic'&&a.role==='Healer'))){act(()=>resolvePlayerAction(B.command,x,y),false);return;}selectBattleHero(unit.key);return;}if(B.command==='move'&&!unit){act(()=>moveBattleHero(x,y),false);return;}if(['attack','skill','tactic'].includes(B.command))act(()=>resolvePlayerAction(B.command,x,y),false);else if(unit?.side)toast(unit.name+' · '+unit.hp+' HP · '+(unit.ranged?'ranged':'melee')+'. Choose Strike or a skill to attack.');}
function endPlayerRound(force=false){if(!actionReady())return;const unused=live(0).filter(a=>!a.acted).length;if(unused&&!force&&!B.endConfirm){B.endConfirm=true;toast(unused+' heroes still have actions. Press End Round again to skip them.');return;}B.phase='enemy';B.endConfirm=false;B.enemyQueue=live(1).sort((a,b)=>b.spd-a.spd).map(a=>a.key);writeLog('Enemy phase. Your orders are locked until the next round.');renderBattle();battleTimer=setTimeout(enemyStep,Math.max(150,450/B.speed));}
function targetForEnemy(e){const allies=live(0),taunts=allies.filter(a=>a.taunt>0&&battleDistance(a,e)<=5);return (taunts.length?taunts:allies).slice().sort((a,b)=>battleDistance(e,a)-battleDistance(e,b)||a.hp/a.max-b.hp/b.max)[0];}
function enemyStep(){if(!B?.tactical||B.phase!=='enemy')return;if(!live(0).length){endBattle(false);return;}if(!live(1).length){endBattle(true);return;}const key=B.enemyQueue.shift();if(!key){finishEnemyRound();return;}const e=B.fighters.find(a=>a.key===key&&a.hp>0);if(!e){battleTimer=setTimeout(enemyStep,30);return;}if(e.stun>0){e.stun--;writeLog(e.name+' loses its action to stun.');}else{e.turns++;if(e.windup){const hits=live(0).filter(a=>B.warnings.some(p=>p.x===a.x&&p.y===a.y));if(!hits.length)writeLog(e.name+' slams the marked tiles, but your squad evades!');for(const a of hits)writeLog(e.name+' telegraphed blast · '+damage(e,a,1.7,{area:true}));}else{let target=targetForEnemy(e);if(target){const range=attackRange(e);if(!canTarget(e,target,range)){const choices=[{x:e.x,y:e.y,d:0},...battleReach(e,2)];choices.sort((a,b)=>{const aa=canTarget(a,target,range)?0:1,bb=canTarget(b,target,range)?0:1;return aa-bb||battleDistance(a,target)-battleDistance(b,target)||a.d-b.d;});const pos=choices[0];B.motion={key:e.key,dx:e.x-pos.x,dy:e.y-pos.y};e.x=pos.x;e.y=pos.y;}target=targetForEnemy(e);if(target&&canTarget(e,target,range)){if((e.boss===3||e.boss===5)&&e.turns%3===0){for(const a of live(0).filter(a=>battleDistance(a,target)<=1))writeLog(e.name+' storm · '+damage(e,a,.9,{area:true}));}else if(e.id&&e.cd===0){writeLog(e.name+' uses '+e.skill+' · '+damage(e,target,Math.min(1.7,e.mult)));e.cd=e.baseCD;}else writeLog(e.name+' attacks · '+damage(e,target));}else writeLog(e.name+' advances toward your formation.');}}}if(e.weaken>0)e.weaken--;if(e.cd>0)e.cd--;renderBattle();if(!live(0).length){battleTimer=setTimeout(()=>endBattle(false),200);return;}battleTimer=setTimeout(enemyStep,Math.max(140,500/B.speed));}
function finishEnemyRound(){if(!B)return;if(B.rule.kind==='poison'){for(const a of live(0)){if(a.antidote>0)continue;const loss=Math.min(a.hp,Math.max(1,Math.round(a.max*.06*(a.guarding ? 0.5 : 1))));a.hp-=loss;writeLog('Venom drains '+loss+' HP from '+a.name+'.');}}if(!live(0).length){endBattle(false);return;}B.round++;if(B.round>60){endBattle(false);return;}const boss=live(1).find(e=>e.boss);if(boss?.boss===2){const n=Math.min(boss.max-boss.hp,Math.round(boss.max*.05));boss.hp+=n;writeLog(boss.name+' regenerates '+n+' HP.');}if(boss?.boss===5&&B.round===3&&!B.adds){B.adds=true;for(const [i,pos] of [{x:6,y:0},{x:6,y:6}].entries()){const add=enemy(35,7+i);Object.assign(add,pos,{key:'reinforcement'+i,ranged:false,guarding:false});B.fighters.push(add);}writeLog('The Last Witness calls two sentries!');}for(const a of live(0)){a.acted=false;a.moved=false;a.guarding=false;if(a.cd>0)a.cd--;if(a.tacticCD>0)a.tacticCD--;if(a.buff>0)a.buff--;if(a.weaken>0)a.weaken--;if(a.taunt>0)a.taunt--;if(a.antidote>0)a.antidote--;}B.phase='player';B.selected=live(0)[0].key;B.command='move';setupWarnings();writeLog('Round '+B.round+': choose your heroes’ moves.');renderBattle();}

function battleUI(){if(!B)return towerUI();const a=currentHero(),reach=a&&!a.moved&&!a.acted&&B.phase==='player'&&B.command==='move'?battleReach(a,moveRange(a)):[],moveKeys=new Set(reach.map(p=>p.x+','+p.y));return `${heading(B.scrapRun?'SALVAGE PATROL':B.dungeon?'DUNGEON ENCOUNTER':B.raid?'RIVAL DEFENCE':'TACTICAL TOWER · FLOOR '+B.floor,B.rule.title,B.rule.hint)}<div class="tactical-layout"><section class="panel"><div class="row space"><h2>Round ${B.round} · ${B.phase==='player'?'Your orders':B.phase==='enemy'?'Enemy phase':'Victory'}</h2><div class="row">${button('Enemy speed '+B.speed+'×','tactical-speed')}${button('Retreat','retreat','danger')}</div></div><div class="tactical-board mt" role="group" aria-label="Tactical battlefield">${Array.from({length:BATTLE_H},(_,y)=>Array.from({length:BATTLE_W},(_,x)=>{const u=unitAt(x,y),wall=battleBlocked(x,y),warning=B.warnings.some(p=>p.x===x&&p.y===y),conduit=B.rule.kind==='conduit'&&B.conduit>0&&x===4&&y===0,cover=(x===3&&y===2)||(x===5&&y===4),hazard=x===4&&y===3,selected=u&&u.key===B.selected,motion=u&&B.motion?.key===u.key;const availableTarget=a&&B.phase==='player'&&['attack','skill','tactic'].includes(B.command)&&canTarget(a,{x,y},B.command==='attack'?attackRange(a):B.command==='skill'?signatureRange(a):3);return `<button class="battle-tile ${wall?'pillar':''} ${moveKeys.has(x+','+y)?'reachable':''} ${warning?'telegraph':''} ${cover?'cover-tile':''} ${hazard?'hazard-tile':''} ${selected?'selected-tile':''} ${availableTarget?'targetable':''}" data-a="battle-tile" data-x="${x}" data-y="${y}" aria-label="Tile ${x+1},${y+1}${u?', '+esc(u.name)+', '+u.hp+' HP':wall?', blocked':conduit?', conduit':warning?', incoming blast':''}" ${wall?'disabled':''}>${conduit?'<span class="tile-object">⟐<small>'+B.conduit+'</small></span>':!u&&cover?'<span class="tile-floor-mark">⛨</span>':!u&&hazard?'<span class="tile-floor-mark">◆</span>':''}${u?`<div class="tile-unit ${u.side?'foe-unit':'ally-unit'} ${u.acted?'spent-unit':''} ${moti function finishRewards(won){if(!won)return null;if(B?.scrapRun){const tier=B.scrapRun,r={scrap:[12,24,40][tier-1],gold:[80,150,250][tier-1],xp:25*tier,gems:0,wood:5*tier};S.scrap+=r.scrap;S.gold+=r.gold;S.wood+=r.wood;for(const id of S.team)gainXP(S.units.find(u=>u.id===id),r.xp);addItem(makeItem(null,tier===3?1:0));record('Recovered '+r.scrap+' scrap from a salvage patrol.');return r;}return preTacticalFinishRewards(won);}
function scrapUI(){return `${heading('SALVAGE YARD','Scrap you can earn, not wait for.','Repeat tactical salvage patrols, dismantle unused gear, or claim daily supplies.',`<span class="pill">⚒ ${S.scrap} SCRAP</span>`)}<div class="basebuild">${[1,2,3].map(t=>{const unlock=[0,10,20][t-1];return `<section class="panel"><div class="gear-glyph">⚒</div><h2>Patrol ${t}</h2><p class="mt">${unlock?'Clear floor '+unlock+' to unlock.':'Available immediately.'}<br>Guaranteed ${[12,24,40][t-1]} scrap + ${[80,150,250][t-1]} gold.<br>Also earns hero XP, timber and a gear drop.</p>${button('Start salvage patrol','scrap-patrol','primary',`data-tier="${t}" style="margin-top:20px" ${S.highest<unlock?'disabled':''}`)}</section>`;}).join('')}</div><section class="panel mt"><h2>Recover materials from spare gear</h2><p class="mt">Common items yield 2 scrap; Rare 4; Epic 6; Legendary 8. Equipped gear is protected from bulk salvage.</p><div class="row mt">${button('Salvage unused Common gear','bulk-salvage','','data-rarity="0"')}${button('Salvage unused Common + Rare','bulk-salvage','','data-rarity="1"')}${button('Open equipment','open-equipment')}</div></section><div class="notice mt">Daily supplies now include 8 scrap. Patrols have no timer or entry cost. Choose a balanced squad before starting.</div>`;}

function filteredGear(){return S.inventory.filter(i=>(gearSlotFilter==='All'||i.slot===gearSlotFilter)&&(gearRarityFilter==='All'||i.rarity===Number(gearRarityFilter))&&(gearOwnerFilter==='All'||(gearOwnerFilter==='Free'?!ownerOf(i.uid):!!ownerOf(i.uid)))).sort((a,b)=>gearScore(b,gearHero)-gearScore(a,gearHero));}

function prepareFloorTeam(f){if(B)throw Error('Finish the current battle first');const roles=[...new Set([...floorTactics(f).roles,'Tank','Healer'])],away=new Set(S.dispatch?.ids||[]),available=S.units.filter(u=>!away.has(u.id)).sort((a,b)=>{const x=stat(a),y=stat(b);return(y.hp+y.atk*4+y.def*3)-(x.hp+x.atk*4+x.def*3);}),ids=[];for(const role of roles){const u=available.find(u=>HERO(u.id).role===role&&!ids.includes(u.id));if(u&&ids.length<4)ids.push(u.id);}for(const u of available)if(ids.length<4&&!ids.includes(u.id))ids.push(u.id);if(!ids.length)throw Error('No heroes are available');S.team=ids;return 'Floor team prepared. Review your squad and gear before entering.';}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;switch(el.dataset.a){case 'battle-tile':battleTileClick(Number(el.dataset.x),Number(el.dataset.y));break;case 'select-fighter':selectBattleHero(el.dataset.key);break;case 'battle-command':selectBattleCommand(el.dataset.command);break;case 'end-round':endPlayerRound();break;case 'tactical-speed':if(B){B.speed=B.speed===1?2:B.speed===2?4:1;S.speed=B.speed;save();renderBattle();}break;case 'scrap-patrol':act(()=>startScrapPatrol(Number(el.dataset.tier)),false);break;case 'open-equipment':navigate('equipment');break;case 'open-scrap':navigate('scrap');break;case 'prepare-floor-team':act(()=>prepareFloorTeam(Number(el.dataset.floor)));break;case 'tactics-gift':act(tacticsGift);break;case 'bulk-salvage':{const rarity=Number(el.dataset.rarity),items=salvageCandidates(rarity),yieldAmount=items.reduce((n,i)=>n+2+i.rarity*2,0);openDialog(`${modalHead('SALVAGE SPARE GEAR?')}<p>Dismantle ${items.length} unequipped ${rarity?'Common and Rare':'Common'} items for <strong>${yieldAmount} scrap</strong>. All equipped items and higher rarities are protected.</p><div class="row mt">${button('Keep gear','close')}${button('Salvage '+items.length+' items','bulk-salvage-confirm','primary',`data-rarity="${rarity}" ${!items.length?'disabled':''}`)}</div>`);break;}case 'bulk-salvage-confirm':{const result=act(()=>bulkSalvage(Number(el.dataset.rarity)));if(result)$('#dialog').close();break;}case 'assign-gear':{const item=S.inventory.find(i=>i.uid===el.dataset.uid);if(!item)return;openDialog(`${modalHead('ASSIGN '+item.slot.toUpperCase())}<h2>${itemName(item)}</h2><p class="mt">Choose a hero to compare stats and assign this item. If already equipped, it transfers from its current owner.</p><div class="assign-grid mt">${S.units.map(u=>{const prior=S.inventory.find(i=>i.uid===S.equipped[u.id]?.[item.slot]),delta=gearScore(item,u.id)-(prior?gearScore(prior,u.id):0);return button(`${HERO(u.id).nam function validExpanded(v){if(!v||v.version!==3||!Array.isArray(v.units)||v.units.length>HERO_DATA.length||!Array.isArray(v.team)||v.team.length>4||!v.base||!Array.isArray(v.history))throw Error('Invalid save');for(const k of ['gems','gold','wood','pity','pulls','highest','daily','raids','raidReady','wins'])if(!Number.isSafeInteger(v[k])||v[k]<0)throw Error('Invalid currency or progress');if(v.highest>50||v.pity>49||![1,2,4].includes(v.speed)||typeof v.auto!=='boolean')throw Error('Save out of range');const ids=new Set();for(const u of v.units){if(!HERO(u.id)||ids.has(u.id)||(u.evolution!==undefined&&(!Number.isInteger(u.evolution)||u.evolution<0||u.evolution>2))||!Number.isInteger(u.level)||u.level<1||u.level>100||!Number.isInteger(u.stars)||u.stars<1||u.stars>5||!Number.isFinite(u.xp)||u.xp<0||!Number.isFinite(u.copies)||u.copies<1)throw Error('Invalid hero');ids.add(u.id);}if(v.team.some(id=>!ids.has(id))||new Set(v.team).size!==v.team.length)throw Error('Invalid team');for(const b of BUILDINGS)if(!Number.isInteger(v.base[b.id])||v.base[b.id]<0||v.base[b.id]>10)throw Error('Invalid base');if(v.dispatch&&(!Number.isFinite(v.dispatch.end)||!['short','long'].includes(v.dispatch.kind)||!Array.isArray(v.dispatch.ids)||v.dispatch.ids.some(id=>!ids.has(id))))throw Error('Invalid expedition');if(!Array.isArray(v.inventory)||v.inventory.length>200||!v.equipped||!v.quest||!v.quest.progress||!Array.isArray(v.quest.claimed)||!Array.isArray(v.rivals)||v.rivals.length>3||!v.cosmetics||!Array.isArray(v.cosmetics.owned)||!COSMETICS.some(c=>c.id===v.cosmetics.active)||!v.cosmetics.owned.includes(v.cosmetics.active)||!['anime','original'].includes(v.banner)||!v.profile||typeof v.profile.name!=='string'||v.profile.name.length>24||typeof v.profile.tag!=='string'||typeof v.riftClaim!=='string'||typeof v.gift!=='boolean'||(v.tacticsGift!==undefined&&typeof v.tacticsGift!=='boolean'))throw Error('Invalid expansion data');for(const n of ['scrap','sigils'])if(!Number.isSafeInteger(v[n])||v[n]<0)throw Error('Invalid materials');const gearIds=new Set();for(const item of v.inventory){if(typeof item.uid!=='string'||gearIds.has(item.uid)||!GEAR_SLOTS.includes(item.slot)||!Number.isInteger(item.rarity)||item.rarity<0||item.rarity>3||!Number.isInteger(item.level)||item.level<1||item.level>10||!ELEMENTS.includes(item.element))throw Error('Invalid equipment');gearIds.add(item.uid);}const equippedIds=new Set();for(const [heroID,slots] of Object.entries(v.equipped)){if(!ids.has(heroID)||!slots||typeof slots!=='object')throw Error('Invalid equipment owner');for(const [slot,itemID] of Object.entries(slots)){if(!GEAR_SLOTS.includes(slot)||equippedIds.has(itemID)||!v.inventory.some(i=>i.uid===itemID&&i.slot===slot))throw Error('Invalid equipped item');equippedIds.add(itemID);}}if(!/^\d{4}-\d{2}-\d{2}$/.test(v.quest.date)||QUESTS.some(q=>!Number.isSafeInteger(v.quest.progress[q.id])||v.quest.progress[q.id]<0))throw Error('Invalid quest state');for(const rival of v.rivals)validateDefense(rival);return v;}

function baseStat(u){const h=HERO(u.id),m=1+(u.level-1)*.105+(u.stars-1)*.18;return{hp:Math.round(h.hp*m*(1+S.base.barracks*.04)),atk:Math.round(h.atk*m*(1+S.base.forge*.03)),def:Math.round(h.def*m+S.base.forge),spd:Math.round(h.spd+(u.level-1)*.18+(u.stars-1)*1.5)};}
function teamPower(){return S.team.reduce((n,id)=>{const t=stat(S.units.find(u=>u.id===id));return n+t.hp+t.atk*4+t.def*3+t.spd*2;},0);}
function levelCost(u){return 70+u.level*45;}function xpNeed(u){return 35+u.level*20;}
function gainXP(u,n){u.xp+=n;let levels=0;while(u.level<100&&u.xp>=xpNeed(u)){u.xp-=xpNeed(u);u.level++;levels++;}if(u.level>=100)u.xp=0;return levels;}
// ===== GACHA: fixed base rates, 50-pull pity, and ten-pull guarantee. =====
function roll(count,rng=Math.random){if(![1,10].includes(count))throw Error('Invalid pull count');const cost=count===10?900:100;if(S.gems<cost)throw Error('Not enough gems. Clear floors or claim the free daily bonus.');S.gems-=cost;const result=[];let rare=false;for(let i=0;i<count;i++){S.pity++;const r=rng();let rarity=S.pity>=50?3:r<.03?3:r<.12?2:r<.40?1:0;if(count===10&&i===9&&!rare&&rarity===0)rarity=1;if(rarity>=1)rare=true;if(rarity===3)S.pity=0;const pool=HERO_DATA.filter(h=>h.rarity===rarity&&(S.banner==='anime'?h.anime:!h.anime)),h=pool[Math.min(pool.length-1,Math.floor(rng()*pool.length))];const old=S.units.find(u=>u.id===h.id);let bonus='NEW HERO';if(old){old.copies++;if(old.stars<5){old.stars++;bonus='DUPLICATE → STAR '+old.stars;}else{gainXP(old,100+rarity*50);S.gold+=100+rarity*50;bonus='DUPLICATE → XP + GOLD';}}else S.units.push({id:h.id,level:1,stars:1,xp:0,copies:1});S.pulls++;progressQuest('pulls');result.push({h,bonus});}record(`Summoned ${count} ${count===1?'hero':'heroes'}.`);return result;}
function pull(n){if(busy)return;const results=act(()=>roll(n),false);if(!results)return;lastPull=results;busy=true;render();openDialog(`<div class="summoning"><div class="eyebrow">CONNECTING TO THE RIFT</div><div class="rift">⟐</div><h2>Someone heard your call…</h2><p class="mt">${n} ${n===1?'echo is':'echoes are'} approaching.</p></div>`);flowTimer=setTimeout(()=>{busy=false;render();openDialog(`${modalHead('SUMMON COMPLETE')}${resultCards(results)}<div class="row mt" style="justify-content:center">${button('Continue','close','primary')}${button('Manage heroes','go-collection')}</div>`);},900);}

function enemy(f,index=0){const e=ENEMY_DATA[(f+index)%ENEMY_DATA.length],growth=1+f*.19+f*f*.004;return{key:'e'+index,name:e.name,icon:e.icon,hp:Math.round(65*growth*e.hp),max:Math.round(65*growth*e.hp),atk:Math.round(14*growth*e.atk),def:Math.round(4+f*.52*e.def),spd:Math.round((12+f*.2)*e.spd),shield:0,cd:0,stun:0,weaken:0,buff:0,turns:0,side:1,element:ELEMENTS[(f+index)%4]};}
function makeEnemies(f){if(f%10!==0)return Array.from({length:f%5===0?4:3},(_,i)=>enemy(f,i));const d=BOSSES[f/10-1],growth=1+f*.19+f*f*.004,hp=Math.round(320*growth);return[{key:'boss',name:d.name,icon:d.icon,hp,max:hp,atk:Math.round(22*growth),def:Math.round(7+f*.65),spd:18+Math.round(f*.23),shield:f===10?Math.round(hp*.35):0,stun:0,weaken:0,buff:0,turns:0,side:1,boss:f/10,element:['Earth','Water','Wind','Dark','Light'][f/10-1]}];}
function fighter(id,side=0,level=null,index=0){let u=S.units.find(x=>x.id===id);if(level!==null)u={id,level,stars:Math.min(5,1+Math.floor(level/12)),xp:0};const h=HERO(id),t=stat(u,side===0);return{...t,element:h.element,key:side?'r'+index:id,id,name:h.name,max:t.hp,hp:t.hp,side,cd:0,shield:0,stun:0,weaken:0,buff:0,turns:0,...evolvedSkill(h,evolutionStage(u)),evolution:evolutionStage(u),queued:false};}
function live(side){return B.fighters.filter(a=>a.side===side&&a.hp>0);}function pick(list){return list[Math.floor(Math.random()*list.length)];}
function legacyBeginBattle(f,raidIndex=null,eventRun=false,dungeonRun=false){if(B||busy)return;if(!S.team.length)throw Error('Choose at least one hero in Team Select.');if(S.dispatch&&S.team.some(id=>S.dispatch.ids.includes(id)))throw Error('A team hero is away on expedition. Replace them or wait for the return.');let foes,raid=null;if(raidIndex!==null){if(Date.now()<S.raidReady)throw Error('Your raiding party is recovering. Check the cooldown.');raid=raidTargets[raidIndex];if(!raid)throw Error('Opponent unavailable');foes=raid.peer?raid.units.map((a,i)=>({...a,name:HERO(a.id).name,key:'peer'+i,side:1,max:a.hp,shield:0,cd:0,stun:0,weaken:0,buff:0,turns:0,queued:false,...skillFields(a.id,a.evolution||0),evolution:a.evolution||0})):raid.ids.map((id,i)=>fighter(id,1,raid.level,i));S.raidReady=Date.now()+120000;save();}else{if(!Number.isInteger(f)||f<1||f>50||(!eventRun&&f>S.highest+1))throw Error('Floor is locked');foes=makeEnemies(f);}B={floor:f,raid,event:eventRun,dungeon:dungeonRun,fighters:[...S.team.map(id=>fighter(id)),...foes],round:0,queue:[],logs:[],speed:S.speed,auto:S.auto,paused:false,over:false,adds:false};applySynergies(B.fighters);if(dungeonRun&&S.dungeon){for(const a of B.fighters.filter(a=>!a.side)){a.hp=Math.max(1,Math.round(a.max*S.dungeon.vitality/100));if(S.dungeon.blessed)a.atk=Math.round(a.atk*1.15);}}if(eventRun){B.fighters.filter(a=>a.side).forEach(a=>{a.hp=a.max=Math.round(a.max*1.15);a.atk=Math.round(a.atk*1.1);});}detailID=null;$('#dialog').close();screen='battle';render();battleTimer=setTimeout(step,500);}
function writeLog(t){B.logs.unshift(t);B.logs=B.logs.slice(0,30);}
function animate(key,cls){const el=document.getElementById('f-'+key);if(!el)return;el.classList.remove('hit','attack','cast');void el.offsetWidth;el.classList.add(cls);}
function floating(key,value,heal=false){const el=document.getElementById('f-'+key);if(!el)return;const pop=document.createElement('span');pop.className='pop'+(heal?' heal':'');pop.textContent=(heal?'+':'−')+value;el.appendChild(pop);setTimeout(()=>pop.remove(),650);}
function legacyDamage(a,target,mult=1){const crit=Math.random()<.12,attack=elementMultiplier(a.element||'Neutral',target.element||'Neutral')*a.atk*(a.buff>0?1.3:1)*(a.weaken>0?.72:1)*(a.boss===4&&a.hp<a.max*.5?1.6:1);let n=Math.max(1,Math.round((attack*mult-target.def*.55)*(.9+Math.random()*.2)*(crit?1.5:1)));const block=Math.min(target.shield,n);target.shield-=block;const dealt=Math.min(target.hp,n-block);target.hp-=dealt;animate(target.key,'hit');floating(target.key,dealt);return `${target.name} −${dealt}${block?' ('+block+' blocked)':''}${crit?' CRIT':''}`;}
function heal(a,t,mult){const n=Math.min(t.max-t.hp,Math.round(a.atk*mult));t.hp+=n;floating(t.key,n,true);return `${t.name} +${n} HP`;}
function useSkill(a){const allies=live(a.side),foes=live(1-a.side),target=foes.slice().sort((x,y)=>x.hp/x.max-y.hp/y.max)[0];a.cd=a.baseCD;a.queued=false;animate(a.key,'cast');let result='';if(a.type==='heal')result=heal(a,allies.slice().sort((x,y)=>x.hp/x.max-y.hp/y.max)[0],a.mult);else if(a.type==='healAll')result=allies.map(t=>heal(a,t,a.mult)).join(', ');else if(a.type==='shieldAll'){const n=Math.round(a.atk*a.mult+a.max*.10);allies.forEach(t=>t.shield=Math.min(t.max,Math.max(t.shield,n)));result='All allies gain '+n+' barrier';}else if(a.type==='rally'){allies.forEach(t=>t.buff=4);result='All allies gain +30% ATK for 3 turns; '+heal(a,allies.slice().sort((x,y)=>x.hp/x.max-y.hp/y.max)[0],a.mult);}else if(a.type==='aoe')result=foes.map(t=>damage(a,t,a.mult)).join(', ');else if(a.type==='weaken'){foes.forEach(t=>t.weaken=4);result=damage(a,target,a.mult)+'; enemy ATK reduced for 3 turns';}else if(a.type==='stun'){target.stun=target.boss?0:1;result=damage(a,target,a.mult)+(target.boss?' · boss resists stun':' · stunned');}else if(a.type==='drain'){result=damage(a,target,a.mult)+'; '+heal(a,a,1.2);}else if(a.type==='execute')result=damage(a,target,a.mult*(target.hp/target.max<.35?1.6:1));else if(a.type==='cleave'){result=damage(a,target,a.mult);foes.filter(t=>t!==target).forEach(t=>damage(a,t,.65));}else if(a.type==='selfShield'){a.shield=Math.min(a.max,a.shield+Math.round(a.max*.35));result=damage(a,target,a.mult)+'; gains a titan barrier';}else if(a.type==='dispel'){foes.forEach(t=>{t.shield=0;t.buff=0;});result=damage(a,target,a.mult)+'; enemy shields and buffs removed';}else result=damage(a,target,a.mult);writeLog(a.name+' uses '+a.skill+' · '+result);}
function legacyStep(){if(!B||B.over)return;if(B.paused){battleTimer=setTimeout(step,150);return;}if(!live(0).length||!live(1).length){endBattle(!!live(0).length);return;}if(!B.queue.length){B.round++;if(B.round>45){endBattle(false);return;}const boss=B.fighters.find(a=>a.boss&&a.hp>0);if(boss?.boss===2){const n=Math.min(boss.max-boss.hp,Math.round(boss.max*.05));boss.hp+=n;writeLog(boss.name+' regenerates '+n+' HP.');}if(boss?.boss===5&&B.round===3&&!B.adds){B.adds=true;let adds=[enemy(35,7),enemy(35,8)];adds.forEach(e=>e.key+='add');B.fighters.push(...adds);writeLog('The Last Witness summons two sentries!');renderBattle();}B.queue=B.fighters.filter(a=>a.hp>0).sort((a,b)=>b.spd-a.spd).map(a=>a.key);}
const key=B.queue.shift(),a=B.fighters.find(x=>x.key===key);if(!a||a.hp<=0){battleTimer=setTimeout(step,30);return;}a.turns++;if(a.buff>0)a.buff--;if(a.weaken>0)a.weaken--;if(a.stun>0){a.stun--;writeLog(a.name+' is stunned.');}else{let ready=a.cd===0;if(a.cd>0)a.cd--;const canSkill=!!a.id&&ready&&(a.side===1||B.auto||a.queued);if(canSkill)useSkill(a);else{animate(a.key,'attack');let foes=live(1-a.side);if(foes.length){if((a.boss===3||a.boss===5)&&a.turns%3===0){writeLog(a.name+' unleashes a storm! '+foes.map(t=>damage(a,t,.85)).join(', '));}else{let tanks=foes.filter(t=>t.role==='Tank'),t=tanks.length&&Math.random()<.6?tanks[0]:pick(foes);writeLog(a.name+' attacks · '+damage(a,t));}}}}
updateBattle();if(!live(0).length||!live(1).length){battleTimer=setTimeout(()=>endBattle(!!live(0).length),Math.max(150,550/B.speed));return;}battleTimer=setTimeout(step,Math.max(120,780/B.speed));}
function baseFinishRewards(won){if(!won)return null;let r;if(B.raid){r={gems:60,gold:250+B.raid.level*40,xp:65,wood:30};S.raids++;}else{const first=B.floor>S.highest;r={gems:first?(B.floor%10===0?250:100):15,gold:100+B.floor*22,xp:40+B.floor*12,wood:8+Math.floor(B.floor/3)};S.highest=Math.max(S.highest,B.floor);S.wins++;}S.gems+=r.gems;S.gold+=r.gold;S.wood+=r.wood;for(const id of S.team){const u=S.units.find(x=>x.id===id);gainXP(u,r.xp);}return r;}

function button(t,a,c='',attrs=''){return `<button class="${c}" data-a="${a}" ${attrs}>${t}</button>`;}function heading(k,t,p='',extra=''){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1>${p?'<p>'+p+'</p>':''}</div>${extra}</div>`;}function modalHead(t){return `<div class="modalhead"><h2>${t}</h2>${button('×','close','close','aria-label="Close dialog"')}</div>`;}function openDialog(html){$('#dialog').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal();}

function makeRaidTargets(){const avg=Math.round(S.units.filter(u=>S.team.includes(u.id)).reduce((n,u)=>n+u.level,0)/Math.max(1,S.team.length));raidTargets=[{name:'The Verdant Keep',ids:['ash','noa','bram'],level:Math.max(1,avg-1)},{name:'Moonfall Bastion',ids:['ren','vera','taron','fern'],level:Math.max(2,avg)},{name:'The Hollow Court',ids:['silas','iris','cassian','vesper'],level:Math.max(3,avg+2)}];}

function fighterUI(a){return `<div id="f-${a.key}" class="fighter ${a.side?'enemy':''} ${a.hp<=0?'dead':''}">${a.id?sprite(HERO(a.id),'',a.evolution||0):`<div class="enemy-art" role="img" aria-label="${esc(a.name)}">${a.icon}</div>`}<div class="name">${a.name}</div><div class="hp"><i style="width:${a.hp/a.max*100}%"></i></div><div class="hptext">${a.hp} / ${a.max}</div><div class="shield">${a.shield?'⛨ '+a.shield+' BARRIER':''}</div>${!a.side?button(a.cd?'COOLDOWN '+a.cd:a.queued?'QUEUED':a.skill,'skill','skill',`data-id="${a.key}" ${a.cd||a.hp<=0?'disabled':''}`):''}</div>`;}
