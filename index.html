function legacyUpdateBattle(){if(!B)return;for(const a of B.fighters){const el=document.getElementById('f-'+a.key);if(!el)continue;el.classList.toggle('dead',a.hp<=0);el.querySelector('.hp i').style.width=a.hp/a.max*100+'%';el.querySelector('.hptext').textContent=a.hp+' / '+a.max;el.querySelector('.shield').textContent=a.shield?'⛨ '+a.shield+' BARRIER':'';const skill=el.querySelector('.skill');if(skill){skill.textContent=a.cd?'COOLDOWN '+a.cd:a.queued?'QUEUED':a.skill;skill.disabled=a.cd>0||a.hp<=0;}}$('#roundLabel').textContent='Round '+B.round;$('#battlelog').innerHTML=B.logs.slice(0,6).map(t=>'<div>'+esc(t)+'</div>').join('');}
function detail(id){const u=S.units.find(x=>x.id===id);if(!u)return;detailID=id;const h=HERO(id),t=stat(u);openDialog(`${modalHead('HERO DOSSIER')}<div class="dossier"><div class="rar${h.rarity}">${sprite(h)}<p style="text-align:center;color:var(--r);font-size:12px">${RARITIES[h.rarity]} · ${'★'.repeat(u.stars)}</p></div><div><div class="eyebrow">${h.role.toUpperCase()} · ${h.element.toUpperCase()} · LEVEL ${u.level}</div><p style="font-size:11px;margin-bottom:10px">${h.series}</p><h1>${h.name}</h1><div class="detailstats">${Object.entries(t).map(([k,v])=>'<div>'+k.toUpperCase()+'<b>'+v+'</b></div>').join('')}</div><div class="skillbox"><h3>${evolvedSkill(h,evolutionStage(u)).skill} · ${evolvedSkill(h,evolutionStage(u)).baseCD}-turn cooldown</h3><p>${evolutionStage(u)?'Base effect: ':''}${skillDesc(h)}${evolutionStage(u)?'<br>Evolution: +'+(evolutionStage(u)===2?35:15)+'% skill power.':''}</p></div><div class="row mt">${button('Manage equipment','gear-hero','','data-id="'+id+'"')}${button('Equip Best','equip-best','primary','data-id="'+id+'"')}${button('Evolution '+evolutionStage(u)+'/2','evolution-view','','data-id="'+id+'"')}<small>${equipmentSummary(id)}</small></div><div class="listline"><span>XP to next level</span><b>${u.level>=100?'MAX':u.xp+' / '+xpNeed(u)}</b></div><div class="row mt">${button(u.level>=100?'Max level':`Level up · ${levelCost(u)} gold`,'level','primary',`data-id="${id}" ${u.level>=100?'disabled':''}`)}${button(S.team.includes(id)?'Remove from team':'Add to team','team','',`data-id="${id}"`)}</div><p class="mt" style="font-size:10px">Duplicates add a star up to five. Each star adds +18% base stats. Each level adds +10.5%. XP from battle and scouting also levels heroes.</p></div></div>`);}
function skillDesc(h){const descriptions={single:`Strikes the weakest enemy for ${Math.round(h.mult*100)}% ATK.`,aoe:`Hits all enemies for ${Math.round(h.mult*100)}% ATK.`,heal:`Heals the lowest-health ally for ${Math.round(h.mult*100)}% ATK.`,healAll:`Heals all living allies for ${Math.round(h.mult*100)}% ATK.`,shieldAll:`Gives all allies a barrier equal to ${Math.round(h.mult*100)}% ATK + 10% of this hero’s HP.`,stun:`Deals ${Math.round(h.mult*100)}% ATK and stuns for one action. Bosses resist stun.`,weaken:`Deals ${Math.round(h.mult*100)}% ATK and reduces all enemy ATK by 28% for three turns.`,rally:`Grants allies +30% ATK for three turns and heals the weakest ally for ${Math.round(h.mult*100)}% ATK.`,drain:`Deals ${Math.round(h.mult*100)}% ATK and restores 120% ATK as HP to self.`};return descriptions[h.type]||({execute:'Deals 210% ATK, increased by 60% against enemies below 35% HP.',cleave:'Hits the weakest enemy for 210% ATK and other enemies for 65% ATK.',selfShield:'Strikes for 220% ATK and gains a barrier equal to 35% of max HP.',dispel:'Removes all enemy barriers and attack buffs, then strikes for 170% ATK.'})[h.type];}
function settings(){openDialog(`${modalHead('SAVE & SETTINGS')}<div class="notice">This is a local single-player game. Save automatically stays in this browser. Export a backup before clearing browser data or moving devices. This fan build has no payments or live accounts. Shareable defence codes let you fight another player’s saved squad offline; combat is not server-verified.</div><div class="settings-row">${button('Export save','export','primary')}${button('Import save','import')}${button('Reset progress…','reset-confirm','danger')}</div><input id="file" type="file" accept=".json,application/json" hidden><div class="divider"></div><h3>Recent chronicle</h3>${S.history.length?S.history.slice(0,12).map(l=>`<div class="chronicle"><span>${esc(l.t)}</span><small>${new Date(l.time).toLocaleString()}</small></div>`).join(''):'<p class="mt">Your story has just begun.</p>'}`);}
function timeLeft(end){const sec=Math.max(0,Math.ceil((end-Date.now())/1000));return Math.floor(sec/60)+'m '+sec%60+'s';}
// ===== EQUIPMENT, ELEMENTS, QUESTS, EVENTS AND SHARED DEFENCE =====
let gearHero='';
function gearStats(item,heroElement){const m=(1+item.rarity*.65)*(1+(item.level-1)*.3)*(item.element===heroElement?1.2:1);return item.slot==='weapon'?{atk:Math.round(9*m),hp:0,def:0,spd:0}:item.slot==='armor'?{atk:0,hp:Math.round(38*m),def:Math.round(4*m),spd:0}:{atk:Math.round(3*m),hp:Math.round(16*m),def:0,spd:Math.round(2*m)};}
function stat(u,includeGear=true){const h=HERO(u.id),t=baseStat(u);if(!includeGear){const m=1+(u.level-1)*.105+(u.stars-1)*.18;t.hp=Math.round(h.hp*m);t.atk=Math.round(h.atk*m);t.def=Math.round(h.def*m);}const stage=evolutionStage(u),factor=stage===2?1.45:stage===1?1.2:1;for(const key of ['hp','atk','def'])t[key]=Math.round(t[key]*factor);t.spd+=stage*2;if(includeGear){const slots=S.equipped[u.id]||{};for(const uid of Object.values(slots)){const item=S.inventory.find(i=>i.uid===uid);if(item){const bonus=gearStats(item,h.element);for(const key of Object.keys(bonus))t[key]+=bonus[key];}}}return t;}
function skillFields(id,stage=0){return evolvedSkill(HERO(id),stage);}
function applySynergies(fighters){const allies=fighters.filter(a=>!a.side),roles=new Set(allies.map(a=>a.role)),elements={};allies.forEach(a=>elements[a.element]=(elements[a.element]||0)+1);for(const a of allies){if(elements[a.element]>=2)a.atk=Math.round(a.atk*1.12);if(roles.size===4)a.hp=a.max=Math.round(a.max*1.08);const series=HERO(a.id)?.series;if(allies.filter(t=>HERO(t.id)?.series===series).length>=3)a.spd+=2;}}
function makeItem(slot=null,forcedRarity=null){const roll=Math.random(),rarity=forcedRarity===null?(roll<.04?3:roll<.2?2:roll<.6?1:0):forcedRarity;return{uid:'gear-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),slot:slot||GEAR_SLOTS[Math.floor(Math.random()*3)],rarity,level:1,element:ELEMENTS[Math.floor(Math.random()*6)]};}
function addItem(item){if(S.inventory.length>=200){S.scrap+=3+item.rarity*2;record('Inventory full: equipment converted to scrap.');return false;}S.inventory.push(item);return true;}
function itemName(item){return GEAR_NAMES[item.slot][item.rarity]+' +'+item.level;}
function ownerOf(uid){return Object.entries(S.equipped).find(([,slots])=>Object.values(slots).includes(uid))?.[0]||'';}
function equipmentSummary(id){const count=Object.values(S.equipped[id]||{}).length;return count+' / 3 gear slots equipped';}
function equipItem(uid,id){const item=S.inventory.find(i=>i.uid===uid);if(!item||!S.units.some(u=>u.id===id))throw Error('Choose a valid item and hero');for(const slots of Object.values(S.equipped))for(const [slot,value] of Object.entries(slots))if(value===uid)delete slots[slot];S.equipped[id]??={};S.equipped[id][item.slot]=uid;return itemName(item)+' equipped on '+HERO(id).name;}
function craft(slot){if(!GEAR_SLOTS.includes(slot))throw Error('Invalid recipe');if(S.inventory.length>=200)throw Error('Inventory is full. Salvage an item first.');if(S.gold<180||S.wood<20||S.scrap<3)throw Error('Crafting needs 180 gold, 20 timber and 3 scrap');S.gold-=180;S.wood-=20;S.scrap-=3;const item=makeItem(slot,Math.random()<.12?2:1);addItem(item);record('Crafted '+itemName(item)+'.');return 'Crafted '+itemName(item);}
function upgradeItem(uid){const item=S.inventory.find(i=>i.uid===uid);if(!item)throw Error('Item not found');if(item.level>=10)throw Error('Equipment is maxed at +10');if(S.gold<120*item.level||S.scrap<item.level+1)throw Error('Upgrade needs '+120*item.level+' gold and '+(item.level+1)+' scrap');S.gold-=120*item.level;S.scrap-=item.level+1;item.level++;return 'Equipment upgraded to +'+item.level;}
function salvage(uid){const item=S.inventory.find(i=>i.uid===uid);if(!item)throw Error('Item not found');if(ownerOf(uid))throw Error('Unequip this item before salvaging');S.inventory=S.inventory.filter(i=>i.uid!==uid);const amount=2+item.rarity*2;S.scrap+=amount;return 'Salvaged for '+amount+' scrap';}
function claimQuest(id){syncQuests();const q=QUESTS.find(q=>q.id===id);if(!q||S.quest.claimed.includes(id))throw Error('Quest already claimed');if(S.quest.progress[id]<q.target)throw Error('Quest is not complete yet');S.quest.claimed.push(id);S.gems+=q.gems;S.gold+=q.gold;S.sigils+=q.sigils;return q.name+' complete! Rewards collected.';}
function expansionFinishRewards(won){if(!won)return null;let r;if(B.event){if(S.riftClaim===today())return{gems:0,gold:0,xp:0,wood:0};r={gems:200,gold:400,xp:100,wood:40};S.gems+=r.gems;S.gold+=r.gold;S.wood+=r.wood;for(const id of S.team)gainXP(S.units.find(u=>u.id===id),r.xp);S.riftClaim=today();record('Cleared the daily rift challenge.');}else r=baseFinishRewards(true);if(!B.raid){const ev=eventInfo(),gold=Math.floor(r.gold*(ev.gold-1)),wood=Math.floor(r.wood*(ev.wood-1)),xp=Math.floor(r.xp*(ev.xp-1));S.gold+=gold;S.wood+=wood;for(const id of S.team)gainXP(S.units.find(u=>u.id===id),xp);r.gold+=gold;r.wood+=wood;r.xp+=xp;progressQuest('clears');}else progressQuest('raids');const scrap=1+Math.floor((B.floor||10)/10);S.scrap+=scrap;r.scrap=scrap;S.sigils+=B.event?10:2;r.sigils=B.event?10:2;if(B.event||B.floor%10===0||Math.random()<.35){const item=makeItem(null,B.event||B.floor>=40?2:B.floor%10===0?Math.random()<.15?3:2:null);if(addItem(item))record('Equipment drop: '+itemName(item)+'.');}return r;}
function equipmentUI(){if(!S.units.some(u=>u.id===gearHero))gearHero=S.team[0]||S.units[0]?.id||'';const hero=HERO(gearHero),slots=S.equipped[gearHero]||{};return `${heading('EQUIPMENT & CRAFTING','Give your heroes an edge.','Weapon, armor and relic slots. Matching gear affinity grants +20% item stats.',`<span class="pill">${S.inventory.length} / 200 ITEMS · ${S.scrap} SCRAP</span>`)}<div class="toolbar"><select id="gearHero" aria-label="Choose hero to equip">${S.units.map(u=>`<option value="${u.id}" ${u.id===gearHero?'selected':''}>${HERO(u.id).name}</option>`).join('')}</select>${button('Equip Best','equip-best','primary')}${button('Equip Best Team','equip-best-team')}<span class="filter-count">${hero?hero.name:''} · ${hero?EICON[hero.element]+' '+hero.element:''}</span></div><div class="notice" style="margin-bottom:18px">Equip Best scores actual stats, upgrades and affinity for the selected hero’s role. It uses unequipped gear and that hero’s current gear. Equip Best Team rebalances gear among your team; other heroes keep their items.</div><div class="basebuild">${GEAR_SLOTS.map(slot=>{const item=S.inventory.find(i=>i.uid===slots[slot]);return `<section class="panel gear-slot"><h3>${slot.toUpperCase()}</h3>${item?`<div class="gear-glyph rar${item.rarity}" style="color:var(--r)">${slot==='weapon'?'⚔':slot==='armor'?'⛨':'◈'}</div><h3>${itemName(item)}</h3><p>${item.element} affinity · ${gearText(item,hero?.element)}</p>${button('Unequip','unequip','',`data-slot="${slot}"`)}`:`<p class="mt">Empty slot. Craft or earn an item below.</p>`}</section>`;}).join('')}</div><section class="panel mt"><div class="row space"><h2>Forge a new item</h2><small>180 gold · 20 timber · 3 scrap each · 88% Rare / 12% Epic</small></div><div class="row mt">${GEAR_SLOTS.map(slot=>button('Craft '+slot,'craft','primary',`data-slot="${slot}"`)).join('')}</div></section><div class="sectionhead row space mt"><h2>Inventory</h2><small>Sorted by strength for the selected hero · Compare / Assign targets any hero</small></div>${gearFilterUI()}<div class="grid mt">${filteredGear().map(item=>{const owner=ownerOf(item.uid);return `<article class="panel rar${item.rarity}" style="border-color:var(--r)"><div class="gear-glyph" style="color:var(--r)">${item.slot==='weapon'?'⚔':item.slot==='armor'?'⛨':'◈'}</div><span style="color:var(--r);font-size:10px">${RARITIES[item.rarity]}</span><h3 class="mt">${itemName(item)}</h3><p style="font-size:11px;margin-top:8px">${item.element} affinity<br>${gearText(item,hero?.element)}<br>${owner?'On '+HERO(owner).name:'Unequipped'}</p><div class="row mt">${button(owner===gearHero?'Equipped':'Equip','equip','primary',`data-uid="${item.uid}" ${owner===gearHero?'disabled':''}`)}${button('+ Level','gear-upgrade','',`data-uid="${item.uid}" ${item.level>=10?'disabled':''}`)}${button('Assign / Compare','assign-gear','',`data-uid="${item.uid}"`)}${button('Salvage','salvage','',`data-uid="${item.uid}" ${owner?'disabled':''}`)}</div><small>${item.level<10?'Upgrade: '+120*item.level+' gold + '+(item.level+1)+' scrap':'Max upgrade'}</small></article>`;}).join('')}</div>${!S.inventory.length?'<div class="notice mt">Craft your first item, or clear floors for equipment drops. Boss victories always drop gear.</div>':''}`;}
function gearText(item,element){return Object.entries(gearStats(item,element)).filter(([,v])=>v).map(([k,v])=>'+'+v+' '+k.toUpperCase()).join(' · ');}
function questsUI(){syncQuests();return `${heading('DAILY MISSIONS','Small steps. Real progress.','Resets at 00:00 UTC. Claimed rewards and progress are saved locally.',`<span class="pill">${today()}</span>`)}<div class="notice">Cosmetic sigils are earned only through play. Complete missions, clear floors and win raids to unlock visual themes.</div><div class="grid mt">${QUESTS.map(q=>{const n=Math.min(S.quest.progress[q.id]||0,q.target),done=S.quest.claimed.includes(q.id);return `<section class="panel"><span class="eyebrow">${q.id.toUpperCase()}</span><h3>${q.name}</h3><div class="listline"><span>Progress</span><b>${n} / ${q.target}</b></div><div class="pity mt"><i style="width:${n/q.target*100}%"></i></div><p class="mt" style="font-size:11px">✦ ${q.gems} gems · ● ${q.gold} gold<br>✧ ${q.sigils} cosmetic sigils</p>${button(done?'Claimed':'Claim rewards','quest-claim','primary',`data-id="${q.id}" style="margin-top:18px" ${done||n<q.target?'disabled':''}`)}</section>`;}).join('')}</div><section class="panel mt"><h2>Elemental field guide</h2><p class="mt">Fire → Wind → Earth → Water → Fire: deal +25% damage with advantage, or −15% in reverse. Light and Dark deal +20% damage to one another. Neutral has no modifiers.</p><p class="mt">Team synergies: 2+ matching elements grant those heroes +12% ATK. All four roles grant the entire team +8% HP. Three heroes from the same series gain +2 SPD.</p></section>`;}
function eventsUI(){const ev=eventInfo(),claimed=S.riftClaim===today(),floor=Math.min(50,S.highest+1);return `${heading('ROTATING RIFT EVENT',ev.name,ev.desc,`<span class="pill">${today()} · DAILY ROTATION</span>`)}<div class="scene"><div class="moon"></div><div class="mountains"></div><div class="castle"></div><div class="scene-label"><span class="pill">CHALLENGE FLOOR ${floor}</span><h2>The unstable breach.</h2><small>Enemies gain +15% HP and +10% ATK.</small></div><div class="scene-team">${S.team.map(id=>sprite(HERO(id))).join('')}</div></div><section class="panel mt"><h2>One challenge. A new reward.</h2><p class="mt">Clear once per UTC day for 200 gems, 400 gold, 100 hero XP, 40 timber, 10 cosmetic sigils and an Epic equipment drop, plus today’s supply bonus. This challenge does not advance your tower floor.</p>${button(claimed?'Today’s rift cleared':'Enter daily challenge','event-fight','primary',`style="margin-top:20px" ${claimed?'disabled':''}`)}<p class="mt" style="font-size:11px">You can retry after defeat. Permanent tower rewards and standard boss mechanics remain unchanged.</p></section>`;}
function atelierUI(){return `${heading('COSMETIC ATELIER','Choose your system’s signature.','Earn every theme through quests and expeditions. Purely visual; no combat bonus.',`<span class="pill">✧ ${S.sigils} SIGILS</span>`)}<div class="notice warning">FREE FAN BUILD · No purchases, prices in money, or payment processing. Cosmetic sigils are earned in play. Anime characters are not offered as paid products.</div><div class="grid mt">${COSMETICS.map(c=>{const owned=S.cosmetics.owned.includes(c.id),active=S.cosmetics.active===c.id;return `<section class="panel"><div class="cosmetic-preview" style="color:${c.color};border-color:${c.color}">${c.glyph}</div><h3 class="mt">${c.name}</h3><p class="mt" style="font-size:11px">${owned?'Owned':c.cost+' earned sigils'} · UI accent palette</p>${button(active?'Equipped':owned?'Equip':'Unlock · '+c.cost+' sigils','cosmetic','primary',`data-id="${c.id}" style="margin-top:20px;background:${c.color}" ${active?'disabled':''}`)}</section>`;}).join('')}</div>`;}
function validateDefense(r){if(!r||r.version!==1||typeof r.name!=='string'||r.name.length<1||r.name.length>24||typeof r.tag!=='string'||r.tag.length>30||!Array.isArray(r.units)||r.units.length<1||r.units.length>4)throw Error('Invalid defence profile');const ids=new Set();for(const u of r.units){if(!HERO(u.id)||ids.has(u.id)||(u.evolution!==undefined&&(!Number.isInteger(u.evolution)||u.evolution<0||u.evolution>2))||u.element!==HERO(u.id).element||!Number.isInteger(u.level)||u.level<1||u.level>100)throw Error('Invalid defending hero');ids.add(u.id);for(const [k,max] of Object.entries({hp:50000,atk:10000,def:10000,spd:300}))if(!Number.isSafeInteger(u[k])||u[k]<1||u[k]>max)throw Error('Invalid defender stats');}return r;}
function defenceCode(){if(!S.team.length)throw Error('Assign a defence team first');const party=S.team.map(id=>({...fighter(id),level:S.units.find(u=>u.id===id).level}));applySynergies(party);const data={version:1,name:S.profile.name,tag:S.profile.tag,units:party.map(a=>({id:a.id,level:a.level,hp:a.max,atk:a.atk,def:a.def,spd:a.spd,element:a.element,evolution:a.evolution||0}))};const bytes=new TextEncoder().encode(JSON.stringify(data));return 'RIFT1.'+btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));}
function importDefense(code){if(typeof code!=='string'||!code.startsWith('RIFT1.')||code.length>12000)throw Error('Not a Riftbound defence code');const data=validateDefense(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(code.slice(6)),c=>c.charCodeAt(0)))));if(data.tag===S.profile.tag)throw Error('That is your own defence code');S.rivals=S.rivals.filter(r=>r.tag!==data.tag);S.rivals.unshift(data);S.rivals=S.rivals.slice(0,3);return data.name+' added to shared defence challenges.';}
function crossoverGift(){if(S.gift)throw Error('Welcome gift already claimed');S.gift=true;S.gems+=900;S.scrap+=10;for(const id of ['rem','taiga']){const u=S.units.find(u=>u.id===id);if(u)u.stars=Math.min(5,u.stars+1);else S.units.push({id,level:1,stars:1,xp:0,copies:1});}record('Claimed crossover welcome bundle: Rem, Taiga, 900 gems and 10 scrap.');return 'Welcome gift: Rem + Taiga, 900 gems and 10 scrap!';}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled||busy)return;const a=el.dataset.a,id=el.dataset.id,uid=el.dataset.uid;switch(a){case 'banner':act(()=>{S.banner=el.dataset.banner;return S.banner==='anime'?'Anime banner selected':'Original banner selected';});break;case 'crossover-gift':act(crossoverGift);break;case 'gear-hero':gearHero=id;navigate('equipment');break;case 'craft':act(()=>craft(el.dataset.slot));break;case 'equip':act(()=>equipItem(uid,gearHero));break;case 'unequip':act(()=>{if(S.equipped[gearHero])delete S.equipped[gearHero][el.dataset.slot];return 'Item unequipped';});break;case 'gear-upgrade':act(()=>upgradeItem(uid));break;case 'salvage':act(()=>salvage(uid));break;case 'quest-claim':act(()=>claimQuest(id));break;case 'event-fight':act(()=>{if(S.riftClaim===today())throw Error('Today’s challenge is already cleared');beginBattle(Math.min(50,S.highest+1),null,true);},false);break;case 'cosmetic':act(()=>{const c=COSMETICS.find(c=>c.id===id);if(!c)throw Error('Theme not found');if(!S.cosmetics.owned.includes(id)){if(S.sigils<c.cost)throw Error('Earn more sigils through quests and expeditions');S.sigils-=c.cost;S.cosmetics.owned.push(id);}S.cosmetics.active=id;return 'Cosmetic palette equipped';});break;case 'profile':openDialog(`${modalHead('COMMANDER PROFILE')}<p>Your local name appears on shared defence codes. This is not an online account.</p><input id="commanderName" aria-label="Commander name" maxlength="24" value="${esc(S.profile.name)}" style="width:100%;margin-top:20px">${button('Save commander name','profile-save','primary','style="margin-top:15px"')}`);break;case 'profile-save':{const result=act(()=>{const name=$('#commanderName').value.trim();if(name.length<1||name.length>24)throw Error('Use 1–24 characters');S.profile.name=name;return 'Commander profile updated';});if(result)$('#dialog').close();break;}case 'defense-export':{const code=act(defenceCode,false);if(code)openDialog(`${modalHead('SHARE YOUR DEFENCE')}<p>Send this code to a friend. It contains your current four-hero team, gear stats and synergy bonuses.</p><textarea class="codebox" id="defenseCode" readonly aria-label="Your defence code">${code}</textarea>${button('Select code','select-code','primary')}<div class="notice mt">A saved snapshot, not live matchmaking. Editing the code can change stats; no server verifies these challenges.</div>`);break;}case 'select-code':$('#defenseCode').select();toast('Code selected. Copy with Ctrl+C or your device’s copy menu.');break;case 'defense-import':openDialog(`${modalHead('IMPORT A FRIEND’S DEFENCE')}<p>Paste a RIFT1 code. Your last three imported teams are saved.</p><textarea class="codebox" id="rivalCode" aria-label="Friend’s defence code" placeholder="RIFT1.…"></textarea>${button('Add rival team','defense-import-confirm','primary')}`);break;case 'defense-import-confirm':{const result=act(()=>importDefense($('#rivalCode').value.trim()));if(result)$('#dialog').close();break;}}});
document.addEventListener('change',e=>{if(e.target.id==='gearHero'){gearHero=e.target.value;render();}});
document.addEventListener('click',e=>{if(e.target.closest('[data-a="rarity-guide"]'))openDialog(`${modalHead('ANIME CHARACTER INDEX')}<p>Rarities are assigned for this game’s balance, not an official ranking of the characters.</p><div class="index-scroll mt"><table class="index-table"><thead><tr><th>Character / Series</th><th>Rarity</th><th>Class / Element</th></tr></thead><tbody>${HERO_DATA.filter(h=>h.anime).map(h=>`<tr class="rar${h.rarity}"><td><strong>${h.name}</strong><small>${h.series}</small></td><td style="color:var(--r)">${RARITIES[h.rarity]}</td><td>${h.role}<small>${EICON[h.element]} ${h.element}</small></td></tr>`).join('')}</tbody></table></div>`);});

// ===== ACTIONS AND INPUT =====
function navigate(next){if(B){toast('Finish or retreat from your current battle first.');return;}if(busy){toast('Your summon is being revealed.');return;}detailID=null;$('#dialog').close();screen=next;render();window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a],[data-screen]');if(!el||el.disabled)return;if(el.dataset.screen){navigate(el.dataset.screen);return;}const id=el.dataset.id,a=el.dataset.a;switch(a){case 'close':if(!busy){detailID=null;$('#dialog').close();}break;case 'go-team':navigate('team');break;case 'go-collection':navigate('collection');break;case 'floor':previewFloor=Number(el.dataset.floor);render();break;case 'fight':act(()=>beginBattle(Number(el.dataset.floor)),false);break;case 'pull':pull(Number(el.dataset.count));break;case 'detail':detail(id);break;case 'team':{const was=detailID;act(()=>{if(S.team.includes(id))S.team=S.team.filter(x=>x!==id);else{if(S.team.length>=4)throw Error('Your team is full. Remove someone first.');if(S.dispatch?.ids.includes(id))throw Error('This hero is away on expedition.');S.team.push(id);}return 'Team updated';});if(was)detail(was);break;}case 'level':{const ok=act(()=>{const u=S.units.find(x=>x.id===id);if(!u||u.level>=100)throw Error('Hero already at max level');if(S.gold<levelCost(u))throw Error('Not enough gold');S.gold-=levelCost(u);u.level++;progressQuest('levels');return 'Level up!';});if(ok)detail(id);break;}case 'daily':act(()=>{if(Date.now()-S.daily<86400000)throw Error('Daily bonus ready in '+timeLeft(S.daily+86400000));S.daily=Date.now();S.gems+=500;S.gold+=300;S.scrap+=8;record('Claimed free daily supplies.');return 'Daily supplies: +500 gems, +300 gold, +8 scrap';});break;case 'speed':if(B){B.speed=B.speed===1?2:B.speed===2?4:1;S.speed=B.speed;save();el.textContent=B.speed+'× speed';}break;case 'auto':if(B){B.auto=!B.auto;S.auto=B.auto;save();el.textContent='Auto skills: '+(B.auto?'ON':'OFF');}break;case 'pause':if(B){B.paused=!B.paused;el.textContent=B.paused?'Resume':'Pause';}break;case 'skill':if(B){const f=B.fighters.find(x=>x.key===id);if(f&&f.cd===0&&f.hp>0){f.queued=!f.queued;updateBattle();toast(f.queued?f.skill+' queued for the next turn.':'Skill unqueued.');}}break;case 'retreat':endBattle(false,true);break;case 'build':act(()=>{const b=BUILDINGS.find(x=>x.id===id);if(!b)throw Error('Unknown building');const level=S.base[id];if(level>=10)throw Error('Already at max level');const gold=300*(level+1),wood=30*(level+1);if(S.gold<gold||S.wood<wood)throw Error('Not enough gold or timber');S.gold-=gold;S.wood-=wood;S.base[id]++;record(b.name+' expanded to level '+S.base[id]+'.');return b.name+' expanded!';});break;case 'dispatch':act(()=>{if(S.dispatch)throw Error('An expedition is already active');const ids=S.units.filter(u=>!S.team.includes(u.id)).slice(0,2).map(u=>u.id);if(!ids.length)throw Error('Assign at least one hero outside your team to scout.');const kind=el.dataset.kind;S.dispatch={kind,ids,end:Date.now()+(kind==='short'?60000:300000)};record('Scouting expedition dispatched.');return 'Scouts dispatched!';});break;case 'collect':act(()=>{const d=S.dispatch;if(!d||Date.now()<d.end)throw Error('Scouts have not returned');const m=1+S.base.hall*.2,long=d.kind==='long',gold=Math.floor((long?700:130)*m),wood=Math.floor((long?100:20)*m);S.gold+=gold;S.wood+=wood;for(const heroID of d.ids)gainXP(S.units.find(u=>u.id===heroID),long?220:50);S.dispatch=null;progressQuest('scouts');record('Scouts returned with '+gold+' gold and '+wood+' timber.');return 'Scouting complete! +'+gold+' gold, +'+wood+' timber and hero XP';});break;case 'raid':act(()=>beginBattle(0,Number(el.dataset.index)),false);break;case 'settings':if(!B&&!busy)settings();else toast('Finish the current event first.');break;case 'help':openDialog(`${modalHead('HOW TO PLAY')}<h2>Summon. Prepare. Ascend.</h2><p class="mt">1. Visit Summon. Single pulls cost 100 gems; ten pulls cost 900 and guarantee a Rare or better. A Legendary is guaranteed within 50 pulls.</p><p class="mt">2. Choose up to four heroes in Team Select. A Tank, Healer, damage dealer and Support make a balanced squad.</p><p class="mt">3. Enter the tower. Select a hero, move across blue tiles, choose Strike, a signature skill, a role Tactic, or Guard, then select a target. End Round gives enemies their turn. Skills use cooldowns; SPD increases movement.</p><p class="mt">4. Victories give gems, gold, timber and hero XP. Spend gold to level heroes, and expand buildings to strengthen everyone. Defeats cost nothing.</p><p class="mt">5. Send spare heroes on timed expeditions, or test your squad in simulated sanctuary raids. Boss mechanics appear every tenth floor.</p><div class="notice mt">This free fan crossover includes 39 anime characters and 24 original heroes. No payment processing is connected. NPC raids are simulated; imported defence codes represent another player’s saved squad, with no live connection or server verification.</div>`);break;case 'export':{const url=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='riftbound-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Save exported');break;}case 'import':$('#file').click();break;case 'reset-confirm':openDialog(`${modalHead('RESET YOUR WORLD?')}<p>This erases your local progress. Export a save first if you want to keep your heroes.</p><div class="row mt">${button('Keep my world','settings')}${button('Erase and start over','reset','danger')}</div>`);break;case 'reset':S=fresh();lastPull=[];previewFloor=0;screen='tower';save();$('#dialog').close();render();toast('A new ascent begins.');break;}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);}});document.addEventListener('change',async e=>{if(e.target.id==='filter'){filter=e.target.value;render();}if(e.target.id==='file'&&e.target.files[0]){try{if(e.target.files[0].size>1000000)throw Error('Save file too large');const data=valid(migrate(JSON.parse(await e.target.files[0].text())));S=data;save();detailID=null;screen='tower';$('#dialog').close();render();toast('Save restored');}catch(error){toast('Import failed: '+error.message);}}});$('#dialog').addEventListener('cancel',e=>{if(busy)e.preventDefault();else detailID=null;});
setInterval(()=>{if(S.dispatch&&$('#dispatchClock')){const ready=Date.now()>=S.dispatch.end;$('#dispatchClock').textContent=ready?'Supplies are ready to collect.':timeLeft(S.dispatch.end);$('#collectButton').disabled=!ready;}if(screen==='raids'&&$('#raidClock')){const cooling=Date.now()<S.raidReady;$('#raidClock').textContent=cooling?'Raid recovery: '+timeLeft(S.raidReady):'Your raiding party is ready.';document.querySelectorAll('[data-a="raid"]').forEach(b=>b.disabled=cooling);}},1000);
render();save();
</script></body></html>
